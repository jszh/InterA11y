<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route 12 — Crosstown · Metro Transit</title>
  <style>
    :root { --ink:#15202b; --muted:#576470; --line:#d9e0e6; --transit:#0b6e63; --bg:#f3f6f7; }
    * { box-sizing: border-box; }
    body { font: 16px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); margin: 0; background: var(--bg); }
    .topbar { background: var(--transit); color: #fff; }
    .topbar-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 10px 18px; }
    .wordmark { font-weight: 800; letter-spacing: .3px; }
    .util { margin-inline-start: auto; display: flex; gap: 6px; }
    .util a { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 9px; color: #fff; text-decoration: none; }
    .util a:hover { background: rgba(255,255,255,.16); }
    .util a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .util svg { width: 21px; height: 21px; }
    main { max-width: 900px; margin: 24px auto; padding: 0 18px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
    th { font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    tr:last-child td { border-bottom: 0; }
  </style>
</head>
