<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders — Looma Goods Seller Console</title>
<style>
  :root { --ink:#1f2733; --muted:#697586; --line:#e2e6ec; --brand:#5b3df5; --bg:#f6f7fb; --ok:#137a3f; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .shell { display:grid; grid-template-columns:200px 1fr; min-height:100vh; }
  aside.side { background:#101725; color:#c7cfdd; padding:18px 14px; }
  aside.side .brand { color:#fff; font-weight:800; margin-bottom:20px; }
  aside.side a { display:block; color:#aeb8c8; text-decoration:none; padding:7px 10px; border-radius:7px; font-size:14px; }
  aside.side a.active, aside.side a:hover { background:#1c2940; color:#fff; }
  main { padding:24px 28px 120px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td { padding:12px 14px; text-align:left; border-bottom:1px solid var(--line); }
  th { background:#f1f3f8; color:var(--muted); font-weight:600; font-size:13px; }
  tr:last-child td { border-bottom:none; }
  .status { font-size:12px; padding:2px 9px; border-radius:999px; display:inline-block; }
  .status.paid { background:#e4f5ea; color:var(--ok); }
  .status.refunded { background:#f3eefc; color:var(--brand); }
  .status.hold { background:#fdf0dd; color:#9a6a12; }
  .menubtn { font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 10px; cursor:pointer; }
  .menubtn:hover { border-color:#c3cad6; }
  .menubtn:focus-visible { outline:3px solid #bdb0fb; outline-offset:2px; }
  .menuwrap { position:relative; display:inline-block; }
  .menu { position:absolute; right:0; top:calc(100% + 4px); background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 36px rgba(0,0,0,.18); min-width:170px; padding:6px; display:none; z-index:20; }
  .menu.open { display:block; }
  .menu button { display:block; width:100%; text-align:left; font:inherit; border:none; background:transparent; padding:8px 10px; border-radius:7px; cursor:pointer; }
  .menu button:hover { background:#f3f4f9; }
  .menu button:focus-visible { outline:2px solid var(--brand); outline-offset:-2px; }
  .menu hr { border:none; border-top:1px solid var(--line); margin:5px 4px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">Looma · Seller</div>
    <a href="#">Dashboard</a>
    <a href="#" class="active">Orders</a>
    <a href="#">Products</a>
    <a href="#">Customers</a>
    <a href="#">Payouts</a>
    <a href="#">Settings</a>
  </aside>

  <main>
    <h1>Orders</h1>
    <p class="sub">Showing 4 of 1,284 orders · last 24 hours</p>

    <table>
      <thead>
        <tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th><span class="sr" style="position:absolute;left:-9999px">Actions</span></th></tr>
      </thead>
      <tbody>
        <tr>
          <td>#LG-90412</td><td>R. Okafor</td><td>$128.00</td>
          <td><span class="status paid">Paid</span></td>
          <td>
            <div class="menuwrap">
              <button class="menubtn" id="trg-1" aria-haspopup="true" aria-expanded="false">Actions ▾</button>
              <div class="menu" id="menu-1" role="menu" aria-label="Actions for order LG-90412">
                <button role="menuitem" data-act="view">View order</button>
                <button role="menuitem" data-act="label">Print label</button>
                <hr>
                <button role="menuitem" data-act="refund">Issue refund</button>
              </div>
            </div>
          </td>
        </tr>
        <tr>
          <td>#LG-90411</td><td>S. Mehta</td><td>$54.50</td>
          <td><span class="status hold">On hold</span></td>
          <td>
            <div class="menuwrap">
              <button class="menubtn" id="trg-2" aria-haspopup="true" aria-expanded="false">Actions ▾</button>
              <div class="menu" id="menu-2" role="menu" aria-label="Actions for order LG-90411">
                <button role="menuitem" data-act="view">View order</button>
                <button role="menuitem" data-act="label">Print label</button>
                <hr>
                <button role="menuitem" data-act="release">Release hold</button>
              </div>
            </div>
          </td>
        </tr>
        <tr>
          <td>#LG-90410</td><td>T. Bauer</td><td>$312.99</td>
          <td><span class="status refunded">Refunded</span></td>
          <td>
            <div class="menuwrap">
              <button class="menubtn" id="trg-3" aria-haspopup="true" aria-expanded="false">Actions ▾</button>
              <div class="menu" id="menu-3" role="menu" aria-label="Actions for order LG-90410">
                <button role="menuitem" data-act="view">View order</button>
                <button role="menuitem" data-act="receipt">Email receipt</button>
              </div>
            </div>
          </td>
        </tr>
        <tr>
          <td>#LG-90409</td><td>D. Ferreira</td><td>$19.99</td>
          <td><span class="status paid">Paid</span></td>
          <td>
            <div class="menuwrap">
              <button class="menubtn" id="trg-4" aria-haspopup="true" aria-expanded="false">Actions ▾</button>
              <div class="menu" id="menu-4" role="menu" aria-label="Actions for order LG-90409">
                <button role="menuitem" data-act="view">View order</button>
                <button role="menuitem" data-act="label">Print label</button>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</div>

<script>
  (function () {
    var trg = document.getElementById('trg-1');
    var menu = document.getElementById('menu-1');
    function open() { menu.classList.add('open'); trg.setAttribute('aria-expanded','true'); menu.querySelector('[role=menuitem]').focus(); }
    function close(returnFocus) {
      menu.classList.remove('open'); trg.setAttribute('aria-expanded','false');
      if (returnFocus) trg.focus();          
    }
    trg.addEventListener('click', function () { menu.classList.contains('open') ? close(true) : open(); });
    menu.addEventListener('click', function (e) { if (e.target.closest('[role=menuitem]')) close(true); });
    menu.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(true); });
  })();

  (function () {
    var trg = document.getElementById('trg-2');
    var menu = document.getElementById('menu-2');
    function open() { menu.classList.add('open'); trg.setAttribute('aria-expanded','true'); menu.querySelector('[role=menuitem]').focus(); }
    function close() {
      menu.classList.remove('open'); trg.setAttribute('aria-expanded','false');
      if (document.activeElement) document.activeElement.blur();   
    }
    trg.addEventListener('click', function () { menu.classList.contains('open') ? close() : open(); });
    menu.addEventListener('click', function (e) { if (e.target.closest('[role=menuitem]')) close(); });
    menu.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  })();

  ['3','4'].forEach(function (n) {
    var trg = document.getElementById('trg-' + n);
    var menu = document.getElementById('menu-' + n);
    function open() { menu.classList.add('open'); trg.setAttribute('aria-expanded','true'); menu.querySelector('[role=menuitem]').focus(); }
    function close(rf) { menu.classList.remove('open'); trg.setAttribute('aria-expanded','false'); if (rf) trg.focus(); }
    trg.addEventListener('click', function () { menu.classList.contains('open') ? close(true) : open(); });
    menu.addEventListener('click', function (e) { if (e.target.closest('[role=menuitem]')) close(true); });
    menu.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(true); });
  });
</script>

</body>
</html>
