<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyHealth Portal — Prescriptions</title>
<style>
  :root { --ink:#1f2933; --paper:#f4f7fa; --teal:#11707a; --line:#d6dee6; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 "Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--paper); }
  header { display:flex; align-items:center; gap:12px;
           padding:14px 28px; border-bottom:1px solid var(--line); background:#fff; }
  .logo { font-weight:700; letter-spacing:.02em; color:var(--teal); font-size:18px; }
  .who { margin-left:auto; font-size:14px; color:#52606d; }
  main { max-width:680px; margin:0 auto; padding:30px 28px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:#52606d; margin:0 0 22px; }
  .rx { border:1px solid var(--line); border-radius:10px; padding:20px 22px; background:#fff; }
  .rx h2 { font-size:18px; margin:0 0 2px; }
  .rx .gen { color:#52606d; font-size:14px; margin:0 0 16px; }
  .refill-status { display:flex; align-items:center; gap:8px;
                   background:#eef6f7; border:1px solid #bfe0e3; border-radius:8px;
                   padding:10px 14px; font-size:16px; color:#0d4f56; margin:0 0 18px; }
  .refill-status .num { font-weight:700; font-variant-numeric:tabular-nums; }
  button { font:inherit; cursor:pointer; border:0; border-radius:7px; padding:11px 18px;
           background:var(--teal); color:#fff; font-weight:600; }
  button:focus-visible { outline:3px solid #1a73e8; outline-offset:2px; }
  button[disabled] { background:#9aa5b1; cursor:not-allowed; }
  footer { max-width:680px; margin:26px auto; padding:0 28px; color:#52606d; font-size:13px; }
  code { background:#e7edf2; padding:1px 5px; border-radius:4px; font-size:13px; }
</style>
</head>
<body>
<header>
  <span class="logo">MyHealth Portal</span>
  <span class="who">Signed in: R. Alvarez</span>
</header>

<main>
  <h1>Prescriptions</h1>
  <p class="sub">Active medications and refill authorizations.</p>

  <section class="rx" aria-labelledby="rx-name">
    <h2 id="rx-name">Levothyroxine 50 mcg</h2>
    <p class="gen">Generic for Synthroid · Take 1 tablet by mouth each morning</p>

    <p class="refill-status" role="status" aria-atomic="false" id="refill-region">
      <span aria-hidden="true">💊</span>
      <span>You have</span>
      <span class="num" id="refill-count">3</span>
      <span>refills remaining</span>
    </p>

    <button id="use" type="button">Request a refill</button>
  </section>
</main>


<script>
  var refills = 3;
  var btn = document.getElementById('use');
  var countEl = document.getElementById('refill-count');
  btn.addEventListener('click', function () {
    if (refills <= 0) return;
    refills -= 1;
    countEl.textContent = String(refills);
    if (refills === 0) {
      btn.disabled = true;
      btn.textContent = 'No refills left';
    }
  });
</script>
</body>
</html>
