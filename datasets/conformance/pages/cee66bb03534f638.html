<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop headphones — Lumen Audio</title>
<style>
  :root { --ink:#181b22; --amber:#c8780f; --amber-dk:#a05f08; --line:#e6e2da; --bg:#faf8f4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Work Sans",Segoe UI,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#181b22; color:#fff; padding:13px 28px; display:flex; align-items:center; gap:16px; }
  header .brand { font-weight:800; letter-spacing:.4px; }
  header .right { margin-left:auto; }
  header a { color:#e8e4dc; text-decoration:none; font-size:.9rem; }
  header a:focus { outline:3px solid var(--amber); outline-offset:3px; }

  .layout { max-width:1000px; margin:28px auto; padding:0 24px; display:grid; grid-template-columns:250px 1fr; gap:28px; }
  aside h2 { font-size:1rem; margin:0 0 14px; }
  .filter { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:18px; }
  .filter h3 { margin:0 0 12px; font-size:.9rem; text-transform:uppercase; letter-spacing:.5px; color:#6c675e; }
  fieldset { border:0; margin:0; padding:0; }
  legend { font-weight:600; font-size:.85rem; margin-bottom:10px; }
  label.brandopt { display:block; font-size:.92rem; margin:8px 0; }

  .slider-wrap { padding:6px 4px 2px; }
  .slider-val { font-weight:700; color:var(--amber-dk); margin-bottom:10px; font-variant-numeric:tabular-nums; }
  .track { position:relative; height:6px; background:#e9e3d8; border-radius:4px; margin:18px 6px; }
  .fill  { position:absolute; left:0; top:0; bottom:0; background:var(--amber); border-radius:4px; }
  .thumb {
    position:absolute; top:50%; width:20px; height:20px; margin-left:-10px; transform:translateY(-50%);
    background:#fff; border:3px solid var(--amber); border-radius:50%; cursor:pointer; outline:none;
  }
  .thumb:focus { box-shadow:0 0 0 4px rgba(200,120,15,.35); border-color:var(--amber-dk); }

  main h1 { font-size:1.45rem; margin:0 0 6px; }
  main p.count { color:#6c675e; margin:0 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .product { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .product h2 { margin:0 0 4px; font-size:1rem; font-weight:700; }
  .product .price { color:var(--amber-dk); font-weight:700; }
  .product a { display:inline-block; margin-top:10px; color:var(--amber-dk); text-decoration:none; font-weight:600; }
  .product a:focus { outline:3px solid #2f80c8; outline-offset:2px; }

  .apply { margin-top:14px; width:100%; padding:11px; border:0; border-radius:8px; background:#8a5207;
           color:#fff; font-weight:700; cursor:pointer; }
  .apply:focus { outline:3px solid #2f80c8; outline-offset:2px; }

  .note { grid-column:1 / -1; background:#fffbe9; border:1px solid #f0e3a8; border-radius:8px;
          padding:12px 14px; font-size:.82rem; color:#6b5e23; margin-top:8px; }
</style>
</head>
<body>
<header>
  <span class="brand">Lumen Audio</span>
  <span class="right"><a href="#cart">Cart (0)</a></span>
</header>

<div class="layout">
  <aside aria-label="Filters">
    <h2>Refine</h2>

    <div class="filter">
      <h3>Max price</h3>
      <div class="slider-wrap">
        <div class="slider-val" id="priceVal">Up to $220</div>
        <div class="track">
          <div class="fill" id="fill" style="width:55%"></div>
          <div class="thumb" id="thumb"
               role="slider"
               tabindex="0"
               aria-label="Maximum price"
               aria-valuemin="0" aria-valuemax="400" aria-valuenow="220" aria-valuetext="$220"
               style="left:55%"></div>
        </div>
      </div>
      <button class="apply" id="applyPrice">Apply price filter</button>
    </div>

    <div class="filter">
      <h3>Brand</h3>
      <fieldset>
        <legend class="sr-only" style="position:absolute;left:-9999px;">Brand</legend>
        <label class="brandopt"><input type="checkbox" name="brand" value="lumen"> Lumen</label>
        <label class="brandopt"><input type="checkbox" name="brand" value="aera"> Aera</label>
        <label class="brandopt"><input type="checkbox" name="brand" value="kove"> Kove</label>
      </fieldset>
    </div>
  </aside>

  <main>
    <h1>Over-ear headphones</h1>
    <p class="count">28 results</p>
    <div class="grid">
      <div class="product"><h2>Lumen Studio 3</h2><div class="price">$199</div><a href="#p1">View product</a></div>
      <div class="product"><h2>Aera Drift ANC</h2><div class="price">$179</div><a href="#p2">View product</a></div>
      <div class="product"><h2>Kove Field Pro</h2><div class="price">$149</div><a href="#p3">View product</a></div>
      <div class="product"><h2>Lumen Air Lite</h2><div class="price">$129</div><a href="#p4">View product</a></div>

    </div>
  </main>
</div>

<script>
(function () {
  var thumb = document.getElementById('thumb');
  var fill  = document.getElementById('fill');
  var valEl = document.getElementById('priceVal');
  var MIN = 0, MAX = 400, STEP = 10;
  var val = 220;

  function render() {
    var pct = (val - MIN) / (MAX - MIN) * 100;
    thumb.style.left = pct + '%';
    fill.style.width = pct + '%';
    thumb.setAttribute('aria-valuenow', val);
    thumb.setAttribute('aria-valuetext', '$' + val);
    valEl.textContent = 'Up to $' + val;
  }
  function set(v) { val = Math.max(MIN, Math.min(MAX, v)); render(); }

  thumb.addEventListener('keydown', function (e) {
    switch (e.key) {
      case 'ArrowUp':
      case 'ArrowRight': e.preventDefault(); set(val + STEP); break;
      case 'ArrowDown':
      case 'ArrowLeft':  e.preventDefault(); set(val - STEP); break;
      case 'PageUp':     e.preventDefault(); set(val + STEP * 5); break;
      case 'PageDown':   e.preventDefault(); set(val - STEP * 5); break;
      case 'Home':       e.preventDefault(); set(MIN); break;
      case 'End':        e.preventDefault(); set(MAX); break;
      case 'Tab':
        e.preventDefault();
        break;
    }
  });

  render();
})();
</script>
</body>
</html>
