<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worksheet 7 — Identify the Elements in Ethanol</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; margin: 0;
      background: #fdfcf8; color: #2b2b2b; line-height: 1.5; }
    .sheet { max-width: 760px; margin: 0 auto; padding: 30px 28px 60px; }
    .course { font-size: .8rem; color: #8a7d62; letter-spacing: 1px; text-transform: uppercase; }
    h1 { font-size: 1.5rem; margin: 4px 0 6px; }
    .lede { font-size: .95rem; color: #4a4a4a; }
    .diagram { background: #fff; border: 1px solid #e4ddc9; border-radius: 6px;
      padding: 14px; margin: 22px 0; text-align: center; }
    .legend { display: inline-flex; gap: 26px; margin-top: 8px; flex-wrap: wrap;
      font-family: ui-sans-serif, system-ui, sans-serif; font-size: .85rem; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .legend i { width: 16px; height: 16px; border-radius: 50%; display: inline-block;
      border: 1px solid rgba(0,0,0,.25); }
    ol.q { font-family: ui-sans-serif, system-ui, sans-serif; }
    ol.q li { margin: 10px 0; }
    ol.q input { border: 1px solid #c9c2ad; border-radius: 4px; padding: 5px 8px;
      width: 140px; font-size: .9rem; }
    label { font-size: .92rem; }
  </style>
</head>
<body>
  <div class="sheet">
    <p class="course">CHEM 101 · Molecular Structures</p>
    <h1>Worksheet 7 — Identify the Elements in Ethanol</h1>
    <p class="lede">
      The ball-and-stick model below shows a single molecule of ethanol (C&#8322;H&#8326;O).
      Using the diagram, identify which element each atom represents, then answer the
      questions.
    </p>

    <figure class="diagram">
      <svg viewBox="0 0 460 220" role="img"
           aria-label="Ball-and-stick model of an ethanol molecule with nine atoms shown as colored spheres connected by bonds."
           width="440">
        <g stroke="#777" stroke-width="5">
          <line x1="120" y1="120" x2="210" y2="100"></line>
          <line x1="210" y1="100" x2="300" y2="120"></line>
          <line x1="300" y1="120" x2="370" y2="90"></line>
          <line x1="120" y1="120" x2="80"  y2="70"></line>
          <line x1="120" y1="120" x2="70"  y2="160"></line>
          <line x1="120" y1="120" x2="140" y2="175"></line>
          <line x1="210" y1="100" x2="195" y2="45"></line>
          <line x1="210" y1="100" x2="255" y2="55"></line>
          <line x1="370" y1="90"  x2="400" y2="135"></line>
        </g>
        <g stroke="rgba(0,0,0,.3)" stroke-width="1">
          <circle cx="120" cy="120" r="22" fill="#333740"></circle> 
          <circle cx="210" cy="100" r="22" fill="#333740"></circle> 
          <circle cx="300" cy="120" r="20" fill="#d64545"></circle> 
          <circle cx="370" cy="90"  r="13" fill="#eef1f4"></circle> 
          <circle cx="80"  cy="70"  r="13" fill="#eef1f4"></circle> 
          <circle cx="70"  cy="160" r="13" fill="#eef1f4"></circle> 
          <circle cx="140" cy="175" r="13" fill="#eef1f4"></circle> 
          <circle cx="195" cy="45"  r="13" fill="#eef1f4"></circle> 
          <circle cx="255" cy="55"  r="13" fill="#eef1f4"></circle> 
          <circle cx="400" cy="135" r="13" fill="#eef1f4"></circle> 
        </g>
      </svg>
      <div class="legend">
        <span><i style="background:#333740"></i>Carbon</span>
        <span><i style="background:#d64545"></i>Oxygen</span>
        <span><i style="background:#eef1f4"></i>Hydrogen</span>
      </div>
    </figure>

    <ol class="q">
      <li>
        <label for="q1">How many <strong>oxygen</strong> atoms are in the molecule?</label><br>
        <input id="q1" type="text" autocomplete="off">
      </li>
      <li>
        <label for="q2">Which element is the atom at the far right (top) of the chain?</label><br>
        <input id="q2" type="text" autocomplete="off">
      </li>
      <li>
        <label for="q3">How many <strong>hydrogen</strong> atoms are bonded to the leftmost carbon?</label><br>
        <input id="q3" type="text" autocomplete="off">
      </li>
    </ol>

  </div>
</body>
</html>
