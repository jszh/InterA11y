<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan your trip — Wayfarer Travel</title>
  <style>
    :root { --ink:#142028; --muted:#566570; --line:#dde6ea; --bg:#f3f8fa; --brand:#0a7d8c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    header.nav { display:flex; justify-content:space-between; align-items:center; padding:14px 26px; background:#fff; border-bottom:1px solid var(--line); }
    header.nav .logo { font-weight:800; font-size:18px; color:var(--brand); }
    header.nav .tools { display:flex; gap:8px; align-items:center; }
    .iconbtn { border:1px solid var(--line); background:#f6fafb; border-radius:8px; width:40px; height:40px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:var(--ink); }
    .iconbtn:hover { background:#eaf4f6; }
    .iconbtn:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
    .iconbtn img { width:22px; height:22px; }
    main { max-width:900px; margin:30px auto; padding:0 26px; }
    h1 { font-size:28px; margin:0 0 6px; }
    p.sub { color:var(--muted); font-size:16px; margin:0 0 26px; }
    .sections { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
    .seclink { display:block; background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; text-decoration:none; color:inherit; text-align:center; }
    .seclink:hover { box-shadow:0 4px 14px rgba(10,125,140,.14); }
    .seclink:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
    .seclink img { width:96px; height:96px; display:block; margin:0 auto 12px; }
    .seclink .cap { font-weight:700; font-size:16px; color:var(--brand); }
    .seclink .desc { color:var(--muted); font-size:13px; margin-top:4px; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="logo">Wayfarer Travel</div>
    <div class="tools">
      <button type="button" class="iconbtn" onclick="window.print()">
        <img alt="Print this page"
             src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23142028' stroke-width='2'&gt;&lt;polyline points='6,9 6,3 18,3 18,9'/&gt;&lt;path d='M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2'/&gt;&lt;rect x='6' y='14' width='12' height='7'/&gt;&lt;/svg&gt;">
      </button>
    </div>
  </header>

  <main>
    <h1>Plan your trip</h1>
    <p class="sub">Choose where you're headed and we'll handle the rest.</p>

    <div class="sections">
      <a class="seclink" href="/international">
        <img alt="International Travel"
             src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'&gt;&lt;circle cx='48' cy='48' r='42' fill='%231a9fb0' stroke='%230a7d8c' stroke-width='3'/&gt;&lt;ellipse cx='48' cy='48' rx='18' ry='42' fill='none' stroke='%23bfeef3' stroke-width='2'/&gt;&lt;line x1='6' y1='48' x2='90' y2='48' stroke='%23bfeef3' stroke-width='2'/&gt;&lt;path d='M30 30 q14 -8 36 4 q-10 10 -30 6 q-8 14 8 26 q-18 -2 -22 -22 z' fill='%23146e7a'/&gt;&lt;path d='M58 58 q14 2 20 14 q-12 6 -24 -2 z' fill='%23146e7a'/&gt;&lt;/svg&gt;">
        <span class="cap" aria-hidden="true">International</span>
        <span class="desc" aria-hidden="true">Flights, visas &amp; guides for trips abroad</span>
      </a>

      <a class="seclink" href="/domestic">
        <img alt="Domestic Travel"
             src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96' fill='none' stroke='%230a7d8c' stroke-width='3'&gt;&lt;path d='M14 70 L48 18 L82 70 Z' fill='%231a9fb0'/&gt;&lt;line x1='48' y1='18' x2='48' y2='70'/&gt;&lt;line x1='30' y1='44' x2='66' y2='44'/&gt;&lt;/svg&gt;">
        <span class="cap" aria-hidden="true">Domestic</span>
        <span class="desc" aria-hidden="true">Trains, road trips &amp; local stays</span>
      </a>

      <a class="seclink" href="/deals">
        <img alt="Last-minute Deals"
             src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96' fill='none' stroke='%230a7d8c' stroke-width='3'&gt;&lt;path d='M50 14 L82 46 L50 78 L18 46 Z' fill='%231a9fb0'/&gt;&lt;circle cx='40' cy='40' r='5' fill='%23fff'/&gt;&lt;line x1='34' y1='58' x2='58' y2='34'/&gt;&lt;/svg&gt;">
        <span class="cap" aria-hidden="true">Deals</span>
        <span class="desc" aria-hidden="true">Limited-time fares this week</span>
      </a>
    </div>
  </main>
</body>
</html>
