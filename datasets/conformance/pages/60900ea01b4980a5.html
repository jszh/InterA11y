<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your order — Saffron Kitchen</title>
<style>
  :root { --ink:#26201a; --line:#e3d9cc; --brand:#9a3b2e; --ok:#1f7a44; }
  * { box-sizing:border-box; }
  body { font:16px/1.55 "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); margin:0; background:#fbf7f1; }
  .wrap { max-width:560px; margin:0 auto; padding:28px 18px 80px; }
  h1 { font-size:22px; margin:.1em 0 .2em; }
  .sub { color:#7a6c5d; margin:0 0 18px; }
  .summary { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; }
  .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); }
  .row:last-of-type { border-bottom:0; font-weight:700; }
  button { font:inherit; font-weight:700; padding:13px 22px; border-radius:9px; border:1px solid transparent; background:var(--brand); color:#fff; cursor:pointer; margin-top:18px; width:100%; }
  .vh { position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0; clip:rect(0 0 0 0); clip-path:inset(50%); overflow:hidden; white-space:nowrap; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
           min-width:280px; max-width:90vw; background:#13301f; color:#eafff0; border-radius:12px;
           padding:14px 16px; display:flex; align-items:center; gap:12px; opacity:0; pointer-events:none;
           transition:opacity .25s, transform .25s; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast svg { width:24px; height:24px; flex:0 0 24px; }
  .toast .txt b { display:block; }
  .toast .txt span { color:#bfe9cd; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Review your order</h1>
  <p class="sub">Saffron Kitchen &middot; pickup at 6:45 PM</p>

  <div class="summary">
    <div class="row"><span>Lamb biryani</span><span>$16.00</span></div>
    <div class="row"><span>Garlic naan (2)</span><span>$6.00</span></div>
    <div class="row"><span>Mango lassi</span><span>$4.50</span></div>
    <div class="row"><span>Total</span><span>$26.50</span></div>
  </div>

  <button type="button" id="placeBtn">Place order</button>

  <div class="toast" id="toast" role="alert" aria-atomic="true">
  </div>
</div>

<script>
  var CHK = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
            '<circle cx="12" cy="12" r="11" fill="#2faa63"/>' +
            '<path d="M7 12.4l3 3 7-7.2" fill="none" stroke="#13301f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var toast = document.getElementById('toast');

  function chime() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ac = new Ctx();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(880, ac.currentTime);
      o.frequency.setValueAtTime(1320, ac.currentTime + 0.12);
      g.gain.setValueAtTime(0.0001, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.2, ac.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.35);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.36);
    } catch (e) {   }
  }

  document.getElementById('placeBtn').addEventListener('click', function () {
    toast.innerHTML = CHK +
      '<span class="txt"><b>Order placed</b>' +
      '<span>Confirmation #SK-4471 &middot; ready ~6:45 PM</span></span>';
    toast.classList.add('show');
    chime();
  });
</script>
</body>
</html>
