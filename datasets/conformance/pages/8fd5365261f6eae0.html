<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue Search — Maplewood Public Library</title>
  <style>
    :root { --ink:#1c2430; --muted:#586472; --line:#d7dde4; --bg:#eef2f6; --brand:#2a5d34; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    header.lib { background:var(--brand); color:#fff; padding:16px 24px; }
    header.lib .name { font-size:20px; font-weight:700; }
    header.lib .sub { font-size:13px; opacity:.85; }
    .searchbar { background:#fff; border-bottom:1px solid var(--line); padding:18px 24px; }
    form.search { max-width:760px; margin:0 auto; display:flex; gap:0; align-items:stretch; }
    form.search label.field { flex:1; display:flex; flex-direction:column; }
    form.search .field-label { font-size:12px; color:var(--muted); margin:0 0 4px; }
    form.search input[type=text] { font-size:16px; padding:10px 12px; border:1px solid var(--line); border-right:0; border-radius:6px 0 0 6px; width:100%; }
    form.search .submit-img { border:1px solid var(--line); background:#f3f6f4; padding:0 14px; border-radius:0; cursor:pointer; display:flex; align-items:center; align-self:flex-end; height:42px; }
    form.search .submit-img:last-child { border-radius:0 6px 6px 0; border-left:0; }
    form.search .submit-img:focus-visible { outline:3px solid var(--brand); outline-offset:1px; }
    main { max-width:760px; margin:24px auto; padding:0 24px; }
    h1 { font-size:22px; margin:0 0 6px; }
    p.note { color:var(--muted); font-size:14px; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .filters a { font-size:13px; color:var(--brand); text-decoration:none; border:1px solid var(--line); padding:6px 10px; border-radius:16px; background:#fff; }
  </style>
</head>
<body>
  <header class="lib">
    <div class="name">Maplewood Public Library</div>
    <div class="sub">Catalogue &amp; Digital Collections</div>
  </header>

  <div class="searchbar">
    <form class="search" action="/catalogue/results" method="get" role="search">
      <label class="field">
        <span class="field-label">Search the catalogue</span>
        <input type="text" name="q" placeholder="Title, author, keyword, or ISBN" autocomplete="off">
      </label>

      <button type="submit" class="submit-img" name="mode" value="quick" aria-hidden="false">
        <img alt="magnifying glass" width="22" height="22"
             src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232a5d34' stroke-width='2'&gt;&lt;circle cx='11' cy='11' r='7'/&gt;&lt;line x1='16.5' y1='16.5' x2='21' y2='21'/&gt;&lt;/svg&gt;">
      </button>

      <button type="submit" class="submit-img" name="mode" value="advanced">
        <img alt="Go" width="22" height="22"
             src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232a5d34' stroke-width='2'&gt;&lt;line x1='4' y1='12' x2='19' y2='12'/&gt;&lt;polyline points='13,6 19,12 13,18'/&gt;&lt;/svg&gt;">
      </button>
    </form>
  </div>

  <main>
    <h1>Find your next read</h1>
    <p class="note">Search across 412,000 books, e-books, audiobooks, and research databases.
       Press the search icon or hit Enter to run your query.</p>
    <div class="filters">
      <a href="/catalogue/new">New arrivals</a>
      <a href="/catalogue/ebooks">E-books</a>
      <a href="/catalogue/kids">Kids &amp; teens</a>
      <a href="/catalogue/local">Local history</a>
    </div>
  </main>
</body>
</html>
