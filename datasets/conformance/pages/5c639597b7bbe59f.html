<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Q4 — Identify the Elements in Acetic Acid</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; margin: 0;
      background: #fdfcf8; color: #2b2b2b; line-height: 1.5; }
    .sheet { max-width: 760px; margin: 0 auto; padding: 30px 28px 60px; }
    .course { font-size: .8rem; color: #7d6f55; letter-spacing: 1px; text-transform: uppercase; }
    h1 { font-size: 1.45rem; margin: 4px 0 6px; }
    .lede { font-size: .95rem; color: #4a4a4a; }
    .diagram { background: #fff; border: 1px solid #e4ddc9; border-radius: 6px;
      padding: 14px; margin: 22px 0; text-align: center; }
    .legend { display: inline-flex; gap: 26px; margin-top: 8px; flex-wrap: wrap;
      font-family: ui-sans-serif, system-ui, sans-serif; font-size: .85rem; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .legend i { width: 18px; height: 18px; border-radius: 50%; display: inline-grid;
      place-items: center; font-size: .72rem; font-weight: 700; color: #fff;
      border: 1px solid rgba(0,0,0,.25); font-family: ui-sans-serif, sans-serif; }
    ol.q { font-family: ui-sans-serif, system-ui, sans-serif; }
    ol.q li { margin: 10px 0; }
    ol.q input { border: 1px solid #c9c2ad; border-radius: 4px; padding: 5px 8px;
      width: 140px; font-size: .9rem; }
    label { font-size: .92rem; }
    .atom-num { font-family: ui-sans-serif, sans-serif; font-weight: 700; }
  </style>
</head>
<body>
  <div class="sheet">
    <p class="course">CHEM 101 · Final Examination</p>
    <h1>Q4 — Identify the Elements in Acetic Acid</h1>
    <p class="lede">
      The model below shows a single molecule of acetic acid (CH&#8323;COOH). Each atom is
      marked with both a color and a number; the legend gives the color and number for every
      element. Use either cue to answer the questions.
    </p>

    <figure class="diagram">
      <svg viewBox="0 0 480 230" role="img"
           aria-label="Ball-and-stick model of acetic acid. Each atom is labeled with a number: 1 = Carbon, 2 = Oxygen, 3 = Hydrogen, matching the legend by both color and number.">
        <g stroke="#777" stroke-width="5">
          <line x1="120" y1="130" x2="220" y2="110"></line>
          <line x1="220" y1="110" x2="320" y2="130"></line>
          <line x1="320" y1="130" x2="320" y2="60"></line>
          <line x1="320" y1="130" x2="410" y2="155"></line>
          <line x1="410" y1="155" x2="440" y2="110"></line>
          <line x1="120" y1="130" x2="80"  y2="80"></line>
          <line x1="120" y1="130" x2="65"  y2="165"></line>
          <line x1="120" y1="130" x2="135" y2="195"></line>
        </g>
        <g font-family="ui-sans-serif, sans-serif" font-weight="700" font-size="15"
           text-anchor="middle" stroke="rgba(0,0,0,.3)">
          <circle cx="120" cy="130" r="22" fill="#333740" stroke-width="1"></circle>
          <text x="120" y="136" fill="#fff" stroke="none">1</text>
          <circle cx="220" cy="110" r="22" fill="#333740" stroke-width="1"></circle>
          <text x="220" y="116" fill="#fff" stroke="none">1</text>
          <circle cx="320" cy="60"  r="20" fill="#d64545" stroke-width="1"></circle>
          <text x="320" y="66" fill="#fff" stroke="none">2</text>
          <circle cx="440" cy="110" r="20" fill="#d64545" stroke-width="1"></circle>
          <text x="440" y="116" fill="#fff" stroke="none">2</text>
          <circle cx="80"  cy="80"  r="13" fill="#cfd6de" stroke-width="1"></circle>
          <text x="80" y="85" fill="#1b1b1b" stroke="none" font-size="12">3</text>
          <circle cx="65"  cy="165" r="13" fill="#cfd6de" stroke-width="1"></circle>
          <text x="65" y="170" fill="#1b1b1b" stroke="none" font-size="12">3</text>
          <circle cx="135" cy="195" r="13" fill="#cfd6de" stroke-width="1"></circle>
          <text x="135" y="200" fill="#1b1b1b" stroke="none" font-size="12">3</text>
          <circle cx="410" cy="155" r="13" fill="#cfd6de" stroke-width="1"></circle>
          <text x="410" y="160" fill="#1b1b1b" stroke="none" font-size="12">3</text>
        </g>
      </svg>
      <div class="legend">
        <span><i style="background:#333740">1</i>Carbon (1)</span>
        <span><i style="background:#d64545">2</i>Oxygen (2)</span>
        <span><i style="background:#cfd6de;color:#1b1b1b">3</i>Hydrogen (3)</span>
      </div>
    </figure>

    <ol class="q">
      <li>
        <label for="q1">How many atoms labeled <span class="atom-num">2</span> (oxygen) are in the molecule?</label><br>
        <input id="q1" type="text" autocomplete="off">
      </li>
      <li>
        <label for="q2">What is the element number of the topmost atom?</label><br>
        <input id="q2" type="text" autocomplete="off">
      </li>
      <li>
        <label for="q3">How many atoms labeled <span class="atom-num">3</span> (hydrogen) bond to the leftmost atom labeled <span class="atom-num">1</span>?</label><br>
        <input id="q3" type="text" autocomplete="off">
      </li>
    </ol>

  </div>
</body>
</html>
