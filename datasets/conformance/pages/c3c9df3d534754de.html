<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mug — Ironbark Pottery</title>
  <style>
    :root { --ink:#1c1a17; --line:#d8d2c8; --accent:#7a4f2a; }
    * { box-sizing: border-box; }
    body { font: 16px/1.55 "Segoe UI", system-ui, sans-serif; color: var(--ink);
           margin: 0; background: #fbf9f5; }
    header { border-bottom: 1px solid var(--line); padding: 14px 24px; display:flex; gap:24px; align-items:center; }
    .brand { font-weight: 700; letter-spacing: .02em; }
    nav a { color: var(--ink); text-decoration: none; margin-right: 18px; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 880px; margin: 0 auto; padding: 28px 24px 64px; }
    .product { display: grid; grid-template-columns: 320px 1fr; gap: 36px; }
    .photo { background: #efe9df; border:1px solid var(--line); border-radius: 10px;
             aspect-ratio: 1/1; display:flex; align-items:center; justify-content:center;
             font-size: 92px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .price { font-size: 1.4rem; color: var(--accent); font-weight: 700; margin: 8px 0 18px; }
    .desc { color:#413d36; }
    label { display:block; font-weight:600; margin: 18px 0 6px; }
    select { padding: 8px 10px; border:1px solid #b9b1a3; border-radius: 6px; min-width: 160px; font: inherit; }

    .add-wrap { display:inline-block; margin-top: 24px; }
    .add-wrap:focus-visible { outline: 3px solid #2a6; outline-offset: 3px; }
    .add-btn { font: inherit; font-weight:700; color:#fff; background: var(--accent);
               border:none; border-radius: 8px; padding: 12px 26px; cursor:pointer; }
    .add-btn:focus-visible { outline: 3px solid #2a6; outline-offset: 3px; }
    .note { margin-top: 14px; color:#6a6256; font-size: .9rem; }
    footer { border-top:1px solid var(--line); padding: 18px 24px; color:#6a6256; font-size:.85rem; }
  </style>
</head>
<body>
  <header>
    <span class="brand">Ironbark Pottery</span>
    <nav aria-label="Primary">
      <a href="#shop">Shop</a><a href="#kilns">Our kilns</a><a href="#about">About</a>
    </nav>
  </header>

  <main>
    <article class="product">
      <div class="photo" role="img" aria-label="A glazed stoneware mug in oatmeal cream">&#9749;</div>
      <div class="info">
        <h1>Oatmeal Stoneware Mug</h1>
        <p class="price">$24.00</p>
        <p class="desc">Hand-thrown and wood-fired in small batches. Holds 350&nbsp;ml.
           Microwave and dishwasher safe.</p>

        <label for="glaze">Glaze</label>
        <select id="glaze" name="glaze">
          <option>Oatmeal cream</option>
          <option>Slate blue</option>
          <option>Forest green</option>
        </select>

        <div class="add-wrap" tabindex="0" role="button"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.querySelector('button').click();}">
          <button type="button" class="add-btn"
                  onclick="document.getElementById('live').textContent='Added 1 Oatmeal Stoneware Mug to your basket.';">
            Add to basket
          </button>
        </div>

        <p class="note" id="live" role="status" aria-live="polite"></p>
      </div>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 Ironbark Pottery Co-operative. Made on Gadigal land.</p>
  </footer>

</body>
</html>
