<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compose Note — Lattice Knowledge Base</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter","Segoe UI",sans-serif; color:#12161d; background:#eef1f5; }
  a { color:#1f6feb; }
  .topbar { background:#0d1117; color:#e6edf3; padding:10px 20px; display:flex; align-items:center; gap:22px; }
  .topbar .brand { font-weight:700; }
  .topbar nav a { color:#9fb3c8; text-decoration:none; font-size:.9rem; }
  .topbar nav a:focus { outline:2px solid #f0b429; outline-offset:2px; }
  .wrap { max-width:880px; margin:24px auto; background:#fff; border:1px solid #d6dce4; border-radius:10px; overflow:hidden; }
  .doc-head { padding:16px 20px 6px; }
  .doc-head h1 { font-size:1.3rem; margin:.1em 0; }
  .doc-head p { color:#5b6675; margin:.2em 0 0; font-size:.9rem; }
  .toolbar { display:flex; gap:6px; padding:8px 14px; border-top:1px solid #eef0f3; border-bottom:1px solid #eef0f3; background:#f7f9fb; }
  .toolbar button { border:1px solid #d6dce4; background:#fff; width:38px; height:34px; border-radius:6px; cursor:pointer; font-size:1rem; line-height:1; }
  .toolbar button:focus { outline:2px solid #1f6feb; outline-offset:1px; }
  .editor { min-height:220px; padding:18px 20px; font-size:1rem; line-height:1.55; outline:none; }
  .editor:focus { box-shadow:inset 0 0 0 2px #cfe0ff; }
  .doc-foot { display:flex; gap:14px; padding:12px 20px; border-top:1px solid #eef0f3; background:#fafbfc; }
  .doc-foot button { padding:8px 16px; border-radius:6px; border:1px solid #d6dce4; background:#fff; cursor:pointer; font-size:.92rem; }
  .doc-foot button.primary { background:#1f6feb; color:#fff; border-color:#1f6feb; }
  .doc-foot button:focus { outline:2px solid #f0b429; outline-offset:2px; }
  .docnote { max-width:880px; margin:16px auto 40px; padding:14px 18px; background:#fff8e1; border:1px dashed #d9c98e; border-radius:8px; font-size:.82rem; color:#5a4f2a; }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Lattice KB</span>
  <nav aria-label="Primary">
    <a href="#spaces">Spaces</a>
    <a href="#search">Search</a>
    <a href="#templates">Templates</a>
    <a href="#profile">Profile</a>
  </nav>
</div>

<div class="wrap">
  <div class="doc-head">
    <h1>Compose a new note</h1>
    <p>Onboarding checklist — draft for the Platform team.</p>
  </div>

  <div class="toolbar" role="toolbar" aria-label="Text formatting">
    <button id="tbFirst" type="button" aria-label="Bold"><b>B</b></button>
    <button type="button" aria-label="Italic"><i>I</i></button>
    <button type="button" aria-label="Bulleted list">&#8226;</button>
    <button type="button" aria-label="Insert link">&#128279;</button>
    <button type="button" aria-label="Code block">&lt;/&gt;</button>
    <button id="tbLast" type="button" aria-label="Insert table">&#9638;</button>
  </div>

  <div class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note body">
    <p>Welcome to the team. Before your first sprint, work through the items below.</p>
  </div>

  <div class="doc-foot">
    <button type="button" id="footFirst">Save draft</button>
    <button type="button" class="primary">Publish</button>
  </div>
</div>


<script>
  (function () {
    var first = document.getElementById('tbFirst');
    var last = document.getElementById('tbLast');
    first.addEventListener('keydown', function (e) {
      if (e.key === 'Tab' && e.shiftKey) {
        e.preventDefault();   
        last.focus();         
      }
    });
  })();
</script>
</body>
</html>
