<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q2 FY24 results — Heliotrope Labs investor relations</title>
  <style>
    :root { --ink:#1a2230; --muted:#667085; --line:#e6e9ef; --brand:#2a4ea8; --bg:#f7f8fb; --pos:#1f8a4c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Inter",system-ui,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); padding:16px 28px; display:flex; justify-content:space-between; align-items:center; }
    .brand { font-weight:800; color:var(--brand); letter-spacing:.5px; }
    .stamp { color:var(--muted); font-size:13px; }
    main { max-width:980px; margin:0 auto; padding:26px 24px 70px; }
    h1 { font-size:24px; margin:4px 0 4px; }
    .sub { color:var(--muted); margin-bottom:24px; }
    .kpis { display:flex; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
    .kpi { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 18px; flex:1; min-width:170px; }
    .kpi .v { font-size:22px; font-weight:700; }
    .kpi .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
    .kpi .d { color:var(--pos); font-size:12px; font-weight:600; }
    .charts { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    figure { margin:0; background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
    figure.full { grid-column:1 / -1; }
    figure h2 { font-size:15px; margin:0 0 12px; }
    figure img { width:100%; height:auto; display:block; }
    figure figcaption { color:var(--muted); font-size:12px; margin-top:10px; }
    @media (max-width:760px){ .charts{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <span class="brand">HELIOTROPE LABS</span>
    <span class="stamp">Investor relations &middot; Q2 FY2024 &middot; Unaudited</span>
  </header>
  <main>
    <h1>Second-quarter results</h1>
    <p class="sub">Reporting period ended June 30, 2024. Figures in USD millions unless noted.</p>

    <section class="kpis" aria-label="Key metrics">
      <div class="kpi"><div class="v">$48.2M</div><div class="l">Revenue</div><div class="d">+19% YoY</div></div>
      <div class="kpi"><div class="v">2.41M</div><div class="l">Monthly active users</div><div class="d">+8% QoQ</div></div>
      <div class="kpi"><div class="v">31%</div><div class="l">Gross margin</div><div class="d">+2 pts</div></div>
    </section>

    <div class="charts">
      <figure>
        <h2>Revenue by quarter</h2>
        <img alt="Chart.jpg" width="430" height="220" src="data:image/svg+xml;utf8,
          <svg xmlns='http://www.w3.org/2000/svg' width='430' height='220' viewBox='0 0 430 220'>
            <rect width='430' height='220' fill='%23ffffff'/>
            <line x1='50' y1='10' x2='50' y2='185' stroke='%23c7ccd6'/>
            <line x1='50' y1='185' x2='415' y2='185' stroke='%23c7ccd6'/>
            <g fill='%232a4ea8'>
              <rect x='80' y='95' width='52' height='90'/>
              <rect x='160' y='80' width='52' height='105'/>
              <rect x='240' y='65' width='52' height='120'/>
              <rect x='320' y='45' width='52' height='140'/>
            </g>
            <g fill='%23667085' font-family='Arial' font-size='11' text-anchor='middle'>
              <text x='106' y='200'>Q3-23</text><text x='186' y='200'>Q4-23</text>
              <text x='266' y='200'>Q1-24</text><text x='346' y='200'>Q2-24</text>
            </g>
            <g fill='%23fff' font-family='Arial' font-size='11' text-anchor='middle' font-weight='bold'>
              <text x='106' y='110'>38</text><text x='186' y='95'>41</text>
              <text x='266' y='80'>44</text><text x='346' y='60'>48</text>
            </g>
          </svg>"/>
        <figcaption>Quarterly revenue, USD millions.</figcaption>
      </figure>

      <figure>
        <h2>Monthly active users</h2>
        <img alt="Chart.jpg" width="430" height="220" src="data:image/svg+xml;utf8,
          <svg xmlns='http://www.w3.org/2000/svg' width='430' height='220' viewBox='0 0 430 220'>
            <rect width='430' height='220' fill='%23ffffff'/>
            <line x1='50' y1='10' x2='50' y2='185' stroke='%23c7ccd6'/>
            <line x1='50' y1='185' x2='415' y2='185' stroke='%23c7ccd6'/>
            <polyline points='70,150 130,140 190,120 250,110 310,90 370,70' fill='none' stroke='%231f8a4c' stroke-width='3'/>
            <g fill='%231f8a4c'><circle cx='70' cy='150' r='4'/><circle cx='130' cy='140' r='4'/><circle cx='190' cy='120' r='4'/><circle cx='250' cy='110' r='4'/><circle cx='310' cy='90' r='4'/><circle cx='370' cy='70' r='4'/></g>
            <g fill='%23667085' font-family='Arial' font-size='11' text-anchor='middle'>
              <text x='70' y='200'>Jan</text><text x='130' y='200'>Feb</text><text x='190' y='200'>Mar</text>
              <text x='250' y='200'>Apr</text><text x='310' y='200'>May</text><text x='370' y='200'>Jun</text>
            </g>
          </svg>"/>
        <figcaption>Monthly active users, millions.</figcaption>
      </figure>

      <figure class="full">
        <h2>Revenue by region</h2>
        <img alt="Chart.jpg" width="900" height="220" src="data:image/svg+xml;utf8,
          <svg xmlns='http://www.w3.org/2000/svg' width='900' height='220' viewBox='0 0 900 220'>
            <rect width='900' height='220' fill='%23ffffff'/>
            <g transform='translate(170,110)'>
              <path d='M0 0 L0 -90 A90 90 0 0 1 86 -27 Z' fill='%232a4ea8'/>
              <path d='M0 0 L86 -27 A90 90 0 0 1 12 89 Z' fill='%231f8a4c'/>
              <path d='M0 0 L12 89 A90 90 0 0 1 -80 -41 Z' fill='%23e08a1e'/>
              <path d='M0 0 L-80 -41 A90 90 0 0 1 0 -90 Z' fill='%23a23a8a'/>
            </g>
            <g font-family='Arial' font-size='14' fill='%231a2230'>
              <rect x='360' y='40' width='14' height='14' fill='%232a4ea8'/><text x='384' y='52'>North America — 45%</text>
              <rect x='360' y='72' width='14' height='14' fill='%231f8a4c'/><text x='384' y='84'>EMEA — 30%</text>
              <rect x='360' y='104' width='14' height='14' fill='%23e08a1e'/><text x='384' y='116'>APAC — 18%</text>
              <rect x='360' y='136' width='14' height='14' fill='%23a23a8a'/><text x='384' y='148'>Latin America — 7%</text>
            </g>
          </svg>"/>
        <figcaption>Share of total revenue by region, Q2 FY2024.</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
