<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New to the studio? — Anchor Yoga</title>
  <style>
    :root { --ink:#1f2a2a; --muted:#5a6a6a; --line:#dde6e4; --brand:#2f7d6b; --bg:#f4f8f7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Avenir Next","Segoe UI",Arial,sans-serif; color:var(--ink); background:var(--bg); }
    .top { display:flex; align-items:center; gap:10px; padding:14px 22px; background:#fff; border-bottom:1px solid var(--line); }
    .top .mark { width:26px; height:26px; border-radius:50%; background:var(--brand); }
    .top .name { font-weight:800; letter-spacing:.04em; }
    .panel { max-width:600px; margin:24px auto; padding:0 18px; }
    .promo { display:block; width:100%; height:auto; border-radius:16px; }
    .copy { margin:18px 4px; color:var(--muted); line-height:1.7; }
    .book { display:inline-block; background:var(--brand); color:#fff; text-decoration:none; padding:12px 24px; border-radius:24px; font-weight:700; }
  </style>
</head>
<body>
  <div class="top">
    <span class="mark" aria-hidden="true"></span>
    <span class="name">ANCHOR YOGA</span>
  </div>

  <div class="panel">
    <img class="promo"
         alt="New student offer: 5 classes for $15. Use code FLEX15 online. Offer ends Friday, March 6."
         src="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='600'%20height='300'%20viewBox='0%200%20600%20300'%3E%3Crect%20width='600'%20height='300'%20fill='%232f7d6b'/%3E%3Crect%20x='18'%20y='18'%20width='564'%20height='264'%20rx='10'%20fill='none'%20stroke='%23bfe0d7'%20stroke-width='2'/%3E%3Ctext%20x='300'%20y='80'%20text-anchor='middle'%20fill='%23dff0eb'%20font-family='Helvetica,Arial,sans-serif'%20font-size='26'%20font-weight='bold'%3ENEW%20STUDENT%20OFFER%3C/text%3E%3Ctext%20x='300'%20y='140'%20text-anchor='middle'%20fill='%23ffffff'%20font-family='Helvetica,Arial,sans-serif'%20font-size='44'%20font-weight='bold'%3E5%20classes%20for%20%2415%3C/text%3E%3Ctext%20x='300'%20y='194'%20text-anchor='middle'%20fill='%23dff0eb'%20font-family='Helvetica,Arial,sans-serif'%20font-size='24'%3EUse%20code%20%3Ctspan%20font-weight='bold'%20fill='%23ffffff'%3EFLEX15%3C/tspan%3E%20online%3C/text%3E%3Ctext%20x='300'%20y='240'%20text-anchor='middle'%20fill='%23bfe0d7'%20font-family='Helvetica,Arial,sans-serif'%20font-size='20'%3EOffer%20ends%20Friday%2C%20March%206%3C/text%3E%3C/svg%3E">

    <p class="copy">All levels welcome. Bring a mat or borrow one of ours. The offer code is
       shown on the banner above and can be applied at online checkout.</p>

    <a class="book" href="https://anchoryoga.example.com/book">Book your first class</a>
  </div>
</body>
</html>
