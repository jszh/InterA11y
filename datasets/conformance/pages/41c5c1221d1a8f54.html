<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عروض العيد — متجر ندى للأزياء</title>
  <style>
    :root { --ink:#241a2e; --muted:#6a5d76; --line:#ece3f1; --brand:#7b2d8e; --bg:#fbf7fd; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Tahoma",Arial,sans-serif; color:var(--ink); background:var(--bg); }
    header { display:flex; align-items:center; gap:10px; padding:14px 22px; background:#fff; border-bottom:1px solid var(--line); }
    header .mark { width:28px; height:28px; border-radius:8px; background:var(--brand); }
    header .name { font-weight:800; }
    .wrap { max-width:640px; margin:24px auto; padding:0 18px; }
    .banner { display:block; width:100%; height:auto; border-radius:14px; }
    .lead { margin:18px 2px; color:var(--muted); line-height:1.8; }
    .cta { display:inline-block; background:var(--brand); color:#fff; text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:700; }
  </style>
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true"></span>
    <span class="name">متجر ندى للأزياء</span>
  </header>

  <div class="wrap">
    <img class="banner"
         alt="seasonal sale graphic"
         src="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='620'%20height='300'%20viewBox='0%200%20620%20300'%3E%3Crect%20width='620'%20height='300'%20fill='%237b2d8e'/%3E%3Crect%20x='16'%20y='16'%20width='588'%20height='268'%20fill='none'%20stroke='%23e9c9f2'%20stroke-width='2'/%3E%3Ctext%20x='310'%20y='78'%20fill='%23f6e6fb'%20font-family='Tahoma,Arial,sans-serif'%20font-size='34'%20font-weight='bold'%20text-anchor='middle'%3E%D8%B9%D8%B1%D9%88%D8%B6%20%D8%A7%D9%84%D8%B9%D9%8A%D8%AF%3C/text%3E%3Ctext%20x='310'%20y='134'%20fill='%23ffffff'%20font-family='Tahoma,Arial,sans-serif'%20font-size='30'%20font-weight='bold'%20text-anchor='middle'%3E%D8%AE%D8%B5%D9%85%2030%25%20%D8%B9%D9%84%D9%89%20%D9%83%D9%84%20%D8%A7%D9%84%D9%81%D8%B3%D8%A7%D8%AA%D9%8A%D9%86%3C/text%3E%3Ctext%20x='310'%20y='188'%20fill='%23f6e6fb'%20font-family='Tahoma,Arial,sans-serif'%20font-size='24'%20text-anchor='middle'%3E%D8%A7%D8%B3%D8%AA%D8%AE%D8%AF%D9%85%20%D8%A7%D9%84%D8%B1%D9%85%D8%B2%20%3Ctspan%20font-weight='bold'%20fill='%23ffffff'%3EEID30%3C/tspan%3E%3C/text%3E%3Ctext%20x='310'%20y='234'%20fill='%23e9c9f2'%20font-family='Tahoma,Arial,sans-serif'%20font-size='20'%20text-anchor='middle'%3E%D8%AD%D8%AA%D9%89%2015%20%D8%B4%D9%88%D8%A7%D9%84%3C/text%3E%3C/svg%3E">

    <p class="lead">تشكيلة العيد وصلت. فساتين سهرة ويومية بألوان الموسم، والكميات محدودة.
       أدخلي رمز الخصم عند إتمام الطلب للاستفادة من العرض الموضّح في الأعلى.</p>

    <a class="cta" href="https://nada.example.com/eid">تسوّقي الآن</a>
  </div>
</body>
</html>
