<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renew vehicle registration — State of Calverton DMV</title>
<style>
  :root { font-family: "Public Sans", system-ui, sans-serif; color: #1b1b1b; }
  body { margin: 0; background: #f0f0f0; }
  .gov-banner { background: #112e51; color: #fff; font-size: .78rem; padding: 4px 26px; }
  header.dmv { background: #fff; border-bottom: 4px solid #112e51; padding: 14px 26px; display: flex; align-items: center; gap: 16px; }
  header.dmv .seal { width: 36px; height: 36px; border-radius: 50%; background: #112e51; color: #fff; display: grid; place-items: center; font-weight: 700; }
  header.dmv .title { font-weight: 700; }
  header.dmv nav a { color: #112e51; text-decoration: none; margin-left: 16px; font-size: .9rem; }
  main { max-width: 720px; margin: 0 auto; padding: 26px; }
  .card { background: #fff; border: 1px solid #d6d7d9; border-radius: 4px; padding: 20px; }
  .backdrop { position: fixed; inset: 0; background: rgba(17,46,81,.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; width: min(480px, 92vw); border-radius: 6px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .modal h2 { margin: 0; background: #112e51; color: #fff; padding: 16px 22px; font-size: 1.1rem; border-radius: 6px 6px 0 0; }
  .modal .b { padding: 22px; }
  .modal label { display: block; font-weight: 600; font-size: .85rem; margin: 12px 0 6px; }
  .modal input, .modal select { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #8d8d8d; border-radius: 4px; font: inherit; }
  .modal .f { padding: 0 22px 22px; display: flex; gap: 10px; justify-content: flex-end; }
  .btn { border: none; border-radius: 4px; padding: 11px 20px; font-weight: 600; font-size: .9rem; cursor: pointer; }
  .btn.go { background: #1a7f37; color: #fff; }
  .btn.no { background: #e1e3e6; color: #1b1b1b; }
  .cookie { position: fixed; left: 16px; bottom: 16px; right: 16px; max-width: 520px; background: #1b1b1b; color: #fff; padding: 16px 18px; border-radius: 6px; z-index: 120; font-size: .85rem; }
  .cookie .cbtns { margin-top: 10px; display: flex; gap: 8px; }
  .cookie button { border: none; border-radius: 4px; padding: 8px 14px; font-weight: 600; font-size: .82rem; cursor: pointer; }
  .cookie .accept { background: #ffbe2e; color: #1b1b1b; }
  .cookie .manage { background: transparent; color: #ffbe2e; border: 1px solid #ffbe2e; }
</style>
</head>
<body>
<div id="page">
  <div class="gov-banner">An official website of the State of Calverton</div>
  <header class="dmv">
    <span class="seal">CV</span>
    <span class="title">Calverton DMV — Vehicle Services</span>
    <nav>
      <a href="#renew">Renew</a>
      <a href="#title">Title transfer</a>
      <a href="#account">My account</a>
    </nav>
  </header>

  <main>
    <h1>Renew vehicle registration</h1>
    <div class="card">
      <p>Plate <strong>CALV-7731</strong> · 2019 Subaru Outback · Expires 31 Aug 2026.</p>
      <p>Renewal fee: <strong>$96.00</strong>.</p>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rn-title" id="modal">
    <h2 id="rn-title">Confirm renewal &amp; payment</h2>
    <div class="b">
      <label for="card">Card number</label>
      <input id="card" type="text" inputmode="numeric" value="•••• •••• •••• 4417">
      <label for="cycle">Registration period</label>
      <select id="cycle"><option>1 year — $96.00</option><option>2 years — $182.00</option></select>
    </div>
    <div class="f">
      <button type="button" class="btn no" id="cancel">Cancel</button>
      <button type="button" class="btn go" id="pay">Pay $96.00</button>
    </div>
  </div>
</div>

<aside class="cookie" id="cookie" aria-label="Cookie consent">
  This site uses cookies to measure traffic.
  <div class="cbtns">
    <button type="button" class="accept" id="cookie-accept">Accept all cookies</button>
    <button type="button" class="manage" id="cookie-manage">Manage preferences</button>
  </div>
</aside>

<script>
  const page = document.getElementById('page');

  page.inert = true;

  window.addEventListener('load', () => document.getElementById('card').focus());

  function close() { page.inert = false; document.getElementById('backdrop').remove(); }
  document.getElementById('cancel').addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); }); 

  document.getElementById('cookie-accept').addEventListener('click', e => { e.currentTarget.textContent = 'Accepted ✓'; });
</script>
</body>
</html>
