<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit page — Hours &amp; Locations | CivicEdit CMS</title>
<style>
  :root { --ink:#1f2733; --line:#d3dae3; --brand:#15616d; --ok:#1f8b4c; }
  * { box-sizing:border-box; }
  body { font:16px/1.55 system-ui, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); margin:0; background:#eef3f4; }
  .app { max-width:840px; margin:0 auto; padding:0 16px 64px; }
  .topbar { display:flex; align-items:center; gap:14px; padding:12px 0; }
  .topbar h1 { font-size:17px; margin:0; font-weight:700; }
  .topbar .right { margin-left:auto; display:flex; align-items:center; gap:16px; }
  .savestate { font-size:13px; color:#5a6675; display:inline-flex; align-items:center; }
  .savestate.saving::after { content:" \2026"; }                 
  .savestate.saved {
    color: var(--ok);
  }
  .savestate.saved::after {
    content: " \2713";        
    font-weight:700;
    margin-left:2px;
  }
  .editor { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .toolbar { display:flex; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); background:#f7fafa; }
  .toolbar button { font:600 14px/1 system-ui; padding:7px 10px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
  .doc { min-height:240px; padding:18px; }
  .doc h2 { margin-top:0; }
  .footer { display:flex; gap:12px; padding:14px 0; }
  .primary { font:inherit; font-weight:600; padding:11px 22px; border-radius:8px; border:1px solid transparent; background:var(--brand); color:#fff; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>Editing: Hours &amp; Locations</h1>
    <div class="right">
      <span class="savestate" id="saveState" aria-live="polite" aria-atomic="true">Draft</span>
    </div>
  </div>

  <div class="editor">
    <div class="toolbar" aria-label="Formatting">
      <button type="button"><strong>B</strong></button>
      <button type="button"><em>I</em></button>
      <button type="button">Link</button>
      <button type="button">List</button>
    </div>
    <div class="doc" contenteditable="true" role="textbox" aria-label="Page body" aria-multiline="true">
      <h2>City Hall — Hours &amp; Locations</h2>
      <p>City Hall is open Monday through Friday, 8:00 AM to 4:30 PM. The Records Office closes for
         lunch from 12:00 to 1:00 PM. Parking is available in the East Lot off 3rd Street.</p>
    </div>
  </div>

  <div class="footer">
    <button type="button" class="primary" id="saveBtn">Save</button>
  </div>
</div>

<script>
  var state = document.getElementById('saveState');
  document.getElementById('saveBtn').addEventListener('click', function () {
    state.className = 'savestate saving';
    state.textContent = 'Saving';
    setTimeout(function () {
      state.className = 'savestate saved';
      state.textContent = '';     
    }, 1200);
  });
</script>
</body>
</html>
