<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donate — Riverbend Food Network</title>
  <style>
    :root { --ink:#16231a; --muted:#5a6b60; --line:#d6e0d8; --leaf:#2f7d4f; --cream:#f5f8f4; }
    * { box-sizing: border-box; }
    body { font: 16px/1.6 "Helvetica Neue", Arial, sans-serif; color: var(--ink); margin: 0; background: var(--cream); }
    .hero { background: var(--leaf); color: #fff; padding: 40px 20px; text-align: center; }
    .hero h1 { margin: 0 0 8px; font-size: 1.9rem; }
    .hero p { margin: 0; opacity: .92; }
    main { max-width: 760px; margin: 30px auto; padding: 0 20px; }
    .give { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
    .give h2 { margin: 0 0 14px; }
    .amounts { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .amounts button { flex: 1; min-width: 90px; padding: 14px; border: 1px solid var(--leaf); background: #fff; color: var(--leaf); border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .amounts button.sel { background: var(--leaf); color: #fff; }
    .give .cta { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #c0431f; color: #fff; font-size: 1.05rem; font-weight: 700; cursor: pointer; }
    footer { border-top: 1px solid var(--line); margin-top: 36px; background: #fff; }
    .foot-inner { max-width: 760px; margin: 0 auto; padding: 24px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .foot-inner .org { font-weight: 700; color: var(--leaf); }
    .foot-inner small { color: var(--muted); display: block; font-weight: 400; }
    .social { display: flex; gap: 8px; }
    .social a { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #eef4ef; color: var(--leaf); text-decoration: none; }
    .social a:hover { background: var(--leaf); color: #fff; }
    .social a:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
    .social svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Help us serve 4,000 meals this winter</h1>
    <p>Riverbend Food Network · feeding neighbors across the river counties since 2009</p>
  </section>

  <main>
    <div class="give">
      <h2>Make a one-time gift</h2>
      <div class="amounts">
        <button type="button">$25</button>
        <button type="button" class="sel">$50</button>
        <button type="button">$100</button>
        <button type="button">$250</button>
      </div>
      <button type="button" class="cta">Donate $50 now</button>
    </div>
  </main>

  <footer>
    <div class="foot-inner">
      <div>
        <span class="org">Riverbend Food Network</span>
        <small>EIN 47-1820394 · 112 Mill Street, Riverbend</small>
      </div>

      <nav class="social" aria-label="Follow us">
        <a href="https://facebook.com/riverbendfood" aria-label="social media">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M13.5 21v-7h2.4l.4-2.8h-2.8V9.4c0-.8.3-1.4 1.5-1.4h1.4V5.5c-.7-.1-1.5-.2-2.3-.2-2.3 0-3.8 1.4-3.8 3.9v2.2H8v2.8h2.3V21z"/>
          </svg>
        </a>
        <a href="https://x.com/riverbendfood" aria-label="social media">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.9 3h3.3l-7.2 8.2L22.5 21h-6.6l-5.2-6.8L4.8 21H1.5l7.7-8.8L1.5 3h6.8l4.7 6.2L17.9 3zm-1.2 16h1.8L7.4 4.9H5.5z"/>
          </svg>
        </a>
        <a href="https://instagram.com/riverbendfood" aria-label="social media">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a href="https://youtube.com/@riverbendfood" aria-label="social media">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M22 8.2a3 3 0 0 0-2.1-2.1C18 5.6 12 5.6 12 5.6s-6 0-7.9.5A3 3 0 0 0 2 8.2 31 31 0 0 0 1.7 12 31 31 0 0 0 2 15.8a3 3 0 0 0 2.1 2.1c1.9.5 7.9.5 7.9.5s6 0 7.9-.5A3 3 0 0 0 22 15.8 31 31 0 0 0 22.3 12 31 31 0 0 0 22 8.2zM10 15V9l5.2 3z"/>
          </svg>
        </a>
      </nav>
    </div>
  </footer>

</body>
</html>
