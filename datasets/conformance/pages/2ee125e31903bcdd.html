<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MercyHealth Patient Portal — Refill Prescription</title>
<style>
  body { font:15px/1.55 'Segoe UI',Roboto,Helvetica,Arial,sans-serif; margin:0; color:#1b2733; background:#eef3f6; }
  .topbar { background:#0a6b6b; color:#fff; padding:11px 20px; display:flex; align-items:center; gap:14px; }
  .topbar strong { font-size:16px; letter-spacing:.2px; }
  .topbar .who { margin-left:auto; font-size:13px; opacity:.9; }
  .card { max-width:560px; margin:22px auto; background:#fff; border:1px solid #d6dee4; border-radius:11px; padding:22px 24px; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:#5a6b78; font-size:13.5px; margin:0 0 18px; }
  .rx { display:flex; gap:14px; align-items:center; border:1px solid #e3e9ee; border-radius:9px; padding:12px 14px; margin-bottom:18px; background:#fafcfd; }
  .rx .pill { width:40px; height:40px; border-radius:50%; background:#e2f1f1; color:#0a6b6b; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .rx .name { font-weight:600; }
  .rx .meta { color:#5a6b78; font-size:12.5px; }
  .focusrow { display:flex; align-items:center; gap:9px; margin:0 0 18px; padding:10px 12px; background:#f4f7f9; border:1px solid #e3e9ee; border-radius:8px; font-size:13.5px; color:#3a4a57; }
  .focusrow button { font:inherit; font-size:13px; border:1px solid #b9c6cf; background:#fff; border-radius:6px; padding:5px 11px; cursor:pointer; }
  .focusrow button[aria-pressed="true"] { background:#0a6b6b; color:#fff; border-color:#0a6b6b; }
  .pickup { display:block; margin:0 0 6px; font-weight:600; }
  select { width:100%; padding:9px 10px; font:inherit; border:1px solid #c3ced6; border-radius:7px; background:#fff; }
  .submit { margin-top:20px; width:100%; padding:12px; font:600 15px inherit; color:#fff; background:#0a6b6b; border:0; border-radius:8px; cursor:pointer; }
  #refillStatus { margin-top:16px; min-height:22px; font-size:14px; }
  #refillStatus.err { color:#b4232a; font-weight:600; }
  #refillStatus.ok  { color:#0a6b6b; }
  .note { max-width:560px; margin:18px auto; background:#fff7e6; border:1px solid #ffe2a8; border-radius:9px; padding:13px 16px; font-size:13px; color:#5b4a16; }
  code { background:#eef1f5; padding:1px 5px; border-radius:4px; font-size:12.5px; }
</style>
</head>
<body>
<div class="topbar">
  <strong>MercyHealth Patient Portal</strong>
  <span class="who">Signed in: D. Okafor</span>
</div>

<div class="card">
  <h1>Refill prescription</h1>
  <p class="sub">Review the medication, choose a pickup pharmacy, then submit your refill request.</p>

  <div class="rx">
    <span class="pill" aria-hidden="true">Rx</span>
    <div>
      <div class="name">Warfarin sodium 5 mg tablet</div>
      <div class="meta">1 tablet daily &middot; Rx #4471902 &middot; 2 refills remaining</div>
    </div>
  </div>

  <div class="focusrow">
    <span>Reduce on-screen announcements while you work</span>
    <button type="button" id="focusToggle" aria-pressed="true">Focus mode: On</button>
  </div>

  <label class="pickup" for="pharmacy">Pickup pharmacy</label>
  <select id="pharmacy">
    <option>MercyHealth Main Campus Pharmacy</option>
    <option>Eastside Community Pharmacy</option>
    <option>Mail order (7–10 days)</option>
  </select>

  <button type="button" class="submit" id="submitBtn">Submit refill request</button>

  <p id="refillStatus" role="status" aria-live="off" aria-atomic="true"></p>
</div>


<script>
  var toggleBtn = document.getElementById('focusToggle');
  var statusEl  = document.getElementById('refillStatus');
  var submitBtn = document.getElementById('submitBtn');

  function applyFocusMode(on) {
    toggleBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    toggleBtn.textContent = 'Focus mode: ' + (on ? 'On' : 'Off');
    statusEl.setAttribute('aria-live', on ? 'off' : 'polite');
  }
  applyFocusMode(true); 

  toggleBtn.addEventListener('click', function () {
    var on = toggleBtn.getAttribute('aria-pressed') === 'true';
    applyFocusMode(!on);
  });

  submitBtn.addEventListener('click', function () {
    statusEl.className = 'err';
    statusEl.textContent =
      'Refill request FAILED: Warfarin 5 mg requires prescriber re-authorization. ' +
      'No refill was submitted — please call your clinic at (555) 0140 to reauthorize.';
  });
</script>
</body>
</html>
