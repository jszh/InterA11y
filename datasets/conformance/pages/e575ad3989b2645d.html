<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify your identity — myGovAccess</title>
<style>
  :root { --ink:#15202b; --muted:#586673; --line:#d7dee5; --gov:#1a5276; --gov-dk:#123c54; --ok:#1e7a46; }
  * { box-sizing:border-box; }
  body { font-family:"Public Sans","Segoe UI",Arial,sans-serif; color:var(--ink); margin:0; background:#eef3f7; }
  .gov-band { background:var(--gov-dk); color:#fff; font-size:.78rem; padding:6px 24px; letter-spacing:.3px; }
  header { background:var(--gov); color:#fff; padding:16px 24px; font-weight:800; letter-spacing:.4px; }
  main { max-width:560px; margin:32px auto; background:#fff; border:1px solid var(--line); border-radius:10px; padding:30px 34px; }
  h1 { font-size:1.45rem; margin:0 0 6px; color:var(--gov); }
  p.lead { margin:0 0 22px; color:var(--muted); }
  .step { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .send { background:var(--gov); color:#fff; border:0; padding:12px 22px; border-radius:7px; font-size:1rem; font-weight:600; cursor:pointer; }
  .send:hover { background:var(--gov-dk); }
  .send:disabled { background:#9bb4c6; cursor:default; }
  .statusline { margin:22px 0 6px; min-height:24px; font-size:.96rem; }
  .statusline .working { color:#7a5b00; display:inline-flex; align-items:center; gap:9px; }
  .statusline .working .dot { width:10px; height:10px; border-radius:50%; background:#d8a200; animation:pulse 1s infinite; }
  .statusline .done { color:var(--ok); display:inline-flex; align-items:center; gap:8px; font-weight:600; }
  @keyframes pulse { 0%,100%{opacity:.35;} 50%{opacity:1;} }
  .codebox { margin-top:18px; display:none; }
  .codebox.show { display:block; }
  .codebox label { display:block; font-weight:600; margin-bottom:8px; }
  .codebox input { width:170px; font-size:1.3rem; letter-spacing:.4em; padding:10px 12px; border:1px solid #b9c4cf; border-radius:7px; text-align:center; }
  footer { max-width:560px; margin:16px auto 60px; color:#94a0aa; font-size:.78rem; }
</style>
</head>
<body>
<div class="gov-band">An official service of the State Digital Office</div>
<header>myGovAccess</header>

<main>
  <p class="step">Step 2 of 3</p>
  <h1>Verify your identity</h1>
  <p class="lead">We'll send a one-time code to the mobile number ending in <strong>•• 47</strong>. Enter it on the next screen to continue.</p>

  <button id="send" class="send" type="button">Send verification code</button>

  <p id="status" class="statusline" role="status" aria-live="polite" aria-atomic="true"></p>

  <div id="codebox" class="codebox">
    <label for="otp">Enter the 6-digit code</label>
    <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-describedby="status">
  </div>
</main>

<footer>State Digital Office — myGovAccess. Never share your verification code.</footer>

<script>
(function () {
  var send = document.getElementById('send');
  var status = document.getElementById('status');
  var codebox = document.getElementById('codebox');

  send.addEventListener('click', function () {
    send.disabled = true;
    status.innerHTML = '<span class="working"><span class="dot" aria-hidden="true"></span>Sending verification code…</span>';

    window.setTimeout(function () {
      status.innerHTML = '<span class="done"><span aria-hidden="true">✓</span>Code sent to the mobile number ending 47. Enter it below.</span>';
      codebox.classList.add('show');
      send.disabled = false;
      send.textContent = 'Resend code';
    }, 1500);
  });
})();
</script>
</body>
</html>
