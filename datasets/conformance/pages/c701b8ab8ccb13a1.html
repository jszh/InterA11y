<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل عضوية جديدة — مكتبة المعرفة</title>
<style>
  body { font-family:"Segoe UI", Tahoma, Arial, sans-serif; color:#1b1b1b; background:#f6f7f9;
         margin:0; padding:36px 16px; }
  .box { max-width:600px; margin:0 auto; background:#fff; border:1px solid #d7dae0;
         border-radius:10px; padding:26px 24px 30px; }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  .note { color:#5c6068; font-size:.85rem; margin:0 0 22px; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 22px; align-items:start; }
  .postal-label { grid-column:1; grid-row:1; }
  .postal-input { grid-column:1; grid-row:2; }
  .postal-msg   { grid-column:2; grid-row:3; }  
  .city-label   { grid-column:2; grid-row:1; }
  .city-input   { grid-column:2; grid-row:2; }

  label { font-weight:600; font-size:.83rem; }
  input { width:100%; box-sizing:border-box; padding:9px 11px; font-size:.95rem;
          border:1px solid #c4c8cf; border-radius:6px; font-family:inherit; }
  input.bad { border-color:#c62828; background:#fdf4f4; }
  .msg { color:#c62828; font-size:.78rem; padding-top:6px; }
  .submit { margin-top:22px; background:#1565c0; color:#fff; border:0; padding:11px 24px;
            border-radius:6px; font-size:.93rem; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <main class="box">
    <h1>تسجيل عضوية جديدة</h1>
    <p class="note">القسم الثاني: العنوان. الحقول المعلَّمة بنجمة مطلوبة.</p>

    <form action="#" novalidate>
      <div class="grid">
        <label class="postal-label" for="postal">الرمز البريدي (5 أرقام)</label>
        <input class="postal-input bad" id="postal" name="postalCode" type="text"
               inputmode="numeric" dir="ltr" value="11564">
        <span class="postal-msg msg">الرمز البريدي يجب أن يتكوّن من 5 أرقام.</span>

        <label class="city-label" for="city">المدينة</label>
        <input class="city-input" id="city" name="city" type="text" value="">
      </div>

      <button type="submit" class="submit">حفظ ومتابعة</button>
    </form>
  </main>

</body>
</html>
