<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make a Donation — Riverkeeper Alliance</title>
  <style>
    :root { --ink:#172a1f; --muted:#5a6b60; --rule:#cfe0d4; --brand:#1c7d4d; --bg:#f3f8f4; --accent:#0f5c38; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Helvetica Neue",Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:var(--accent); color:#fff; padding:1rem 1.3rem; }
    header .org { font-weight:800; letter-spacing:.02em; }
    header .tag { font-size:.8rem; opacity:.9; }
    .card { max-width:560px; margin:1.6rem auto; background:#fff; border:1px solid var(--rule); border-radius:12px; padding:1.6rem; }
    h1 { font-size:1.5rem; margin:0 0 .3rem; }
    .sub { color:var(--muted); margin:0 0 1.2rem; }

    form.donate { display:flex; flex-direction:column; }
    .block-amount  { order:1; }
    .block-contact { order:2; }
    .block-actions { order:3; }

    fieldset { border:1px solid var(--rule); border-radius:10px; margin:0 0 1.1rem; padding:1rem 1.1rem 1.2rem; }
    legend { font-weight:700; padding:0 .4rem; }
    .presets { display:flex; gap:.6rem; flex-wrap:wrap; margin:.4rem 0 .8rem; }
    .presets label { flex:1 1 28%; }
    .presets input { position:absolute; opacity:0; }
    .presets span { display:block; text-align:center; border:1px solid var(--rule); border-radius:8px; padding:.7rem .2rem; font-weight:700; cursor:pointer; }
    .presets input:focus + span { outline:3px solid #ffbf47; outline-offset:2px; }
    .presets input:checked + span { background:var(--brand); color:#fff; border-color:var(--brand); }
    label.fld { display:block; font-weight:600; font-size:.9rem; margin:.6rem 0 .3rem; }
    input.txt { width:100%; padding:.55rem .65rem; font-size:1rem; border:1px solid var(--rule); border-radius:6px; }
    input.txt:focus { outline:3px solid #ffbf47; outline-offset:1px; border-color:var(--brand); }
    button { width:100%; font-size:1.05rem; font-weight:800; padding:.8rem; border:0; border-radius:8px; background:var(--brand); color:#fff; cursor:pointer; }
    button:focus { outline:3px solid #ffbf47; outline-offset:2px; }
    footer { color:var(--muted); font-size:.76rem; text-align:center; padding:1.4rem; }
  </style>
</head>
<body>
  <header>
    <div class="org">Riverkeeper Alliance</div>
    <div class="tag">Protecting the watershed since 1987</div>
  </header>

  <main>
    <form class="donate" action="/process" method="post" novalidate>
      <h1 style="order:0">Make a one-time donation</h1>
      <p class="sub" style="order:0">Choose an amount, tell us who you are, and you're done.</p>

      <fieldset class="block-contact">
        <legend>Your details</legend>
        <label class="fld" for="name">Full name</label>
        <input class="txt" id="name" name="name" autocomplete="name" tabindex="3">
        <label class="fld" for="email">Email for your receipt</label>
        <input class="txt" id="email" name="email" type="email" autocomplete="email" tabindex="4">
      </fieldset>

      <fieldset class="block-amount">
        <legend>Choose an amount</legend>
        <div class="presets" role="radiogroup" aria-label="Preset donation amount">
          <label><input type="radio" name="amt" value="25" tabindex="1"><span>$25</span></label>
          <label><input type="radio" name="amt" value="50" tabindex="1"><span>$50</span></label>
          <label><input type="radio" name="amt" value="100" tabindex="1"><span>$100</span></label>
        </div>
        <label class="fld" for="custom">Or enter a custom amount (USD)</label>
        <input class="txt" id="custom" name="custom_amount" inputmode="decimal" placeholder="e.g. 75" tabindex="2">
      </fieldset>

      <div class="block-actions">
        <button type="submit" tabindex="5">Donate now</button>
      </div>
    </form>
  </main>

  <footer>Riverkeeper Alliance is a registered 501(c)(3). Donations are tax-deductible.</footer>
</body>
</html>
