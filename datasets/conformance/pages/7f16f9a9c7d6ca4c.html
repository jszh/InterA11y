<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New patient intake — Cedar Valley Family Health</title>
<style>
  :root{ --ink:#1a2230; --muted:#5d6675; --line:#d2d8e0; --brand:#1f5fa8; --danger:#c0271f; }
  *{ box-sizing:border-box; }
  body{ margin:0; font:16px/1.55 "Source Sans 3","Segoe UI",system-ui,sans-serif;
        color:var(--ink); background:#f3f6fa; }
  .wrap{ max-width:680px; margin:36px auto; padding:0 18px; }
  .masthead{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .masthead .cross{ width:30px; height:30px; border-radius:7px; background:var(--brand);
        position:relative; }
  .masthead .cross::before,.masthead .cross::after{ content:""; position:absolute; background:#fff; }
  .masthead .cross::before{ left:13px; top:7px; width:4px; height:16px; border-radius:2px; }
  .masthead .cross::after{ top:13px; left:7px; height:4px; width:16px; border-radius:2px; }
  .masthead strong{ font-size:1.1rem; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:28px 28px 24px;
         box-shadow:0 4px 16px rgba(20,30,50,.05); }
  h1{ font-size:1.3rem; margin:0 0 2px; }
  .step{ color:var(--muted); font-size:.86rem; margin:0 0 22px; }
  fieldset{ border:0; padding:0; margin:0 0 6px; }
  legend{ font-weight:700; font-size:1rem; padding:0; margin-bottom:14px; }
  .row{ display:flex; gap:16px; flex-wrap:wrap; }
  .field{ flex:1 1 220px; margin-bottom:18px; }
  label{ display:block; font-weight:600; font-size:.88rem; margin-bottom:6px; }
  .hint{ color:var(--muted); font-size:.8rem; margin:0 0 7px; }
  input{ width:100%; padding:10px 12px; font-size:1rem; border:2px solid var(--line);
         border-radius:8px; background:#fff; color:var(--ink); }
  input[aria-invalid="true"]{ border-color:var(--danger); background:#fff8f8; }
  input:focus{ outline:2px solid var(--brand); outline-offset:1px; }
  .err{ color:var(--danger); font-size:.85rem; margin-top:7px; font-weight:600; }
  .actions{ margin-top:8px; display:flex; gap:12px; }
  button{ padding:11px 22px; font-size:1rem; font-weight:600; border-radius:8px; cursor:pointer; }
  .primary{ color:#fff; background:var(--brand); border:0; }
  .ghost{ background:#fff; border:2px solid var(--line); color:var(--ink); }
  .foot{ margin-top:18px; color:var(--muted); font-size:.78rem; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="masthead"><span class="cross" aria-hidden="true"></span><strong>Cedar Valley Family Health</strong></div>
    <main class="card">
      <h1>New patient intake</h1>
      <p class="step">Section 1 of 5 — Patient identity</p>

      <form action="#" method="post" novalidate>
        <fieldset>
          <legend>Patient identity</legend>
          <div class="row">
            <div class="field">
              <label for="legalname">Legal name</label>
              <input id="legalname" name="legalname" type="text" value="Rosa Beaumont"
                     autocomplete="name">
            </div>
            <div class="field">
              <label for="dob">Date of birth</label>
              <p class="hint" id="dob-hint">Format: MM/DD/YYYY</p>
              <input id="dob" name="dob" type="text" inputmode="numeric"
                     value="03/14/2099"
                     aria-describedby="dob-hint dob-err" aria-invalid="true"
                     autocomplete="bday">
              <p class="err" id="dob-err">Date of birth must be in the past. Enter a date before today.</p>
            </div>
          </div>
        </fieldset>

        <div class="actions">
          <button type="submit" class="primary">Save &amp; continue</button>
          <button type="button" class="ghost">Back</button>
        </div>
      </form>
    </main>
    <p class="foot">Cedar Valley Family Health · Patient services (555) 274-9000 · Renders from file://</p>
  </div>
</body>
</html>
