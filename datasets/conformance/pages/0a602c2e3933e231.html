<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Registration — Spring Term · Brightwater College</title>
<style>
  body { font:15px/1.55 "Open Sans",Segoe UI,system-ui,sans-serif; color:#1f2933;
         background:#eef2f6; margin:0; }
  .panel { max-width:640px; margin:26px auto; background:#fff; border-radius:10px;
           border:1px solid #d7dde3; padding:30px 38px 38px; }
  .crest { color:#0d4f8b; font-weight:700; letter-spacing:.05em; font-size:.8rem;
           margin:0 0 6px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .term { color:#5b6b7b; margin:0 0 20px; font-size:.95rem; }
  .legend { background:#f4f8fc; border:1px solid #d3e2f1; border-radius:6px;
            padding:10px 14px; margin:0 0 24px; font-size:.92rem; }
  .f { margin-bottom:16px; }
  .f label { display:block; font-weight:600; margin-bottom:5px; }
  .f.req label { color:#c62828; }
  .f input, .f select {
    width:100%; box-sizing:border-box; padding:9px 11px; font:inherit;
    border:1px solid #b9c1c9; border-radius:5px; background:#fff;
  }
  .row2 { display:flex; gap:16px; }
  .row2 > .f { flex:1; }
  button { background:#0d4f8b; color:#fff; border:0; padding:11px 28px; font:inherit;
           font-weight:600; border-radius:6px; cursor:pointer; margin-top:8px; }
</style>
</head>
<body>
<main class="panel">
  <p class="crest">BRIGHTWATER COLLEGE · REGISTRAR</p>
  <h1>Course Registration</h1>
  <p class="term">Spring Term 2026 · enrolment closes 14 January</p>

  <p class="legend"><strong>Required fields are shown in red and marked with (required).</strong>
  Optional fields may be left blank.</p>

  <form action="#" novalidate>
    <div class="row2">
      <div class="f req">
        <label for="sid">Student ID (required)</label>
        <input id="sid" name="sid" type="text" aria-required="true">
      </div>
      <div class="f">
        <label for="alt">Alternate email</label>
        <input id="alt" name="alt" type="email" autocomplete="email">
      </div>
    </div>

    <div class="f req">
      <label for="course">Course code (required)</label>
      <input id="course" name="course" type="text" aria-required="true"
             placeholder="e.g. BIOL-210">
    </div>

    <div class="f req">
      <label for="section">Section (required)</label>
      <select id="section" name="section" aria-required="true">
        <option value="">Choose a section…</option>
        <option>A — Mon/Wed 09:00</option>
        <option>B — Tue/Thu 13:00</option>
        <option>C — Fri 10:00 (lab)</option>
      </select>
    </div>

    <div class="f">
      <label for="waitlist">Add me to the waitlist if the section is full</label>
      <select id="waitlist" name="waitlist">
        <option value="">No preference</option>
        <option>Yes, waitlist me</option>
        <option>No, do not waitlist me</option>
      </select>
    </div>

    <div class="f req">
      <label for="advisor">Advisor approval code (required)</label>
      <input id="advisor" name="advisor" type="text" aria-required="true">
    </div>

    <div class="f">
      <label for="notes">Notes for the registrar</label>
      <input id="notes" name="notes" type="text">
    </div>

    <button type="submit">Submit registration</button>
  </form>
</main>
</body>
</html>
