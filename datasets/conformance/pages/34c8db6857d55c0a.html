<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerline — Invoice Draft</title>
<style>
  :root { --ink:#11253b; --line:#d7dee6; --accent:#1f6feb; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; color: var(--ink); background: #f5f7fa;
  }
  .appbar {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 10px 22px; display: flex; align-items: center; gap: 14px;
  }
  .appbar .brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
  .appbar .crumb { color: #5b6b7c; font-size: 13px; }
  .toolbar {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 8px 22px; display: flex; gap: 8px; align-items: center;
  }
  .tbtn {
    height: 34px; padding: 0 14px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); border-radius: 6px;
    font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  }
  .tbtn:hover { background: #f0f4f9; }
  .tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tbtn.primary:hover { background: #1a5fcc; }
  .tbtn .ic { font-size: 15px; line-height: 1; }
  main { max-width: 820px; margin: 26px auto; padding: 0 22px 60px; }
  .sheet {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 28px 30px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: #5b6b7c; font-size: 13px; margin: 0 0 22px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: #5b6b7c; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  td.amt, th.amt { text-align: right; font-variant-numeric: tabular-nums; }
  .total td { font-weight: 700; border-bottom: 0; padding-top: 14px; }
  .note { margin-top: 30px; font-size: 12px; color: #6a7686; line-height: 1.55; }
  .note code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <header class="appbar">
    <span class="brand">Ledgerline</span>
    <span class="crumb">Invoices › Draft #INV-20418</span>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Invoice actions">
    <button class="tbtn primary" type="button" title="Save your work">
      <span class="ic" aria-hidden="true">&#128190;</span>Save
    </button>
    <button class="tbtn" type="button" title="Download a PDF copy of this invoice">
      <span class="ic" aria-hidden="true">&#11015;</span>Export
    </button>
    <button class="tbtn" type="button" title="Email this invoice to the client">
      <span class="ic" aria-hidden="true">&#9993;</span>Send
    </button>
    <button class="tbtn" type="button" title="Duplicate this invoice as a new draft">
      <span class="ic" aria-hidden="true">&#128203;</span>Duplicate
    </button>
  </div>

  <main>
    <div class="sheet">
      <h1>Invoice #INV-20418 — Draft</h1>
      <p class="muted">Bill to: Harbor &amp; Finch Architects · Due May 30, 2026</p>

      <table>
        <thead>
          <tr><th>Description</th><th class="amt">Qty</th><th class="amt">Rate</th><th class="amt">Amount</th></tr>
        </thead>
        <tbody>
          <tr><td>Schematic design — phase 1</td><td class="amt">40</td><td class="amt">$135.00</td><td class="amt">$5,400.00</td></tr>
          <tr><td>Permit drawings &amp; revisions</td><td class="amt">18</td><td class="amt">$135.00</td><td class="amt">$2,430.00</td></tr>
          <tr><td>Site visit (Cedar St.)</td><td class="amt">6</td><td class="amt">$110.00</td><td class="amt">$660.00</td></tr>
          <tr class="total"><td colspan="3">Total due</td><td class="amt">$8,490.00</td></tr>
        </tbody>
      </table>

    </div>
  </main>

</body>
</html>
