<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Active Heat Advisories — Cascade County Emergency Management</title>
  <style>
    :root { --ink:#1b1b1f; --muted:#565a63; --line:#d8dce2; --bg:#eef1f5; --alert:#b3261e; --gov:#1a3e6e; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Public Sans",Arial,Helvetica,sans-serif; color:var(--ink); background:var(--bg); }
    .gov-banner { background:#0b2a4a; color:#dfe8f3; font-size:12px; padding:6px 16px; }
    .masthead { background:var(--gov); color:#fff; padding:16px 20px; }
    .masthead h1 { font-size:18px; margin:0; }
    .masthead p { margin:3px 0 0; font-size:13px; color:#c9d8ec; }
    .container { max-width:820px; margin:0 auto; padding:24px 18px 50px; }
    .alertbar { background:#fdeceb; border:1px solid #f3c6c2; border-left:5px solid var(--alert); border-radius:8px; padding:12px 16px; color:#5b1713; font-size:14px; margin-bottom:20px; }
    .alertbar strong { color:var(--alert); }
    figure { margin:0; background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; }
    figure img { display:block; width:100%; max-width:560px; margin:0 auto; height:auto; border:1px solid var(--line); border-radius:6px; }
    .longdesc { color:var(--muted); font-size:13.5px; line-height:1.65; margin:16px auto 0; max-width:600px; }
    .meta { color:var(--muted); font-size:12px; margin-top:18px; }
  </style>
</head>
<body>
  <div class="gov-banner">An official site of Cascade County, State of Columbia</div>
  <div class="masthead">
    <h1>Cascade County Emergency Management</h1>
    <p>Real-time hazard advisories for residents</p>
  </div>

  <div class="container">
    <div class="alertbar">
      <strong>SEVERE HEAT WARNING IN EFFECT.</strong> A dangerous heat event is impacting
      parts of the county through 8:00 PM Thursday. Check the map for affected areas.
    </div>

    <figure>
      <img
        alt="Map of Cascade County divided into five counties. Counties shaded red are under a Severe Heat Warning; counties shaded grey are not under any advisory at this time."
        aria-describedby="heatLongDesc"
        src="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='560'%20height='420'%20viewBox='0%200%20560%20420'%3E%3Crect%20width='560'%20height='420'%20fill='%23eef3f8'/%3E%3Cg%20stroke='%23ffffff'%20stroke-width='3'%3E%3Cpolygon%20points='20,20%20280,20%20270,200%2030,210'%20fill='%23b9c0c9'/%3E%3Cpolygon%20points='280,20%20540,30%20530,190%20270,200'%20fill='%23c62f25'/%3E%3Cpolygon%20points='30,210%20270,200%20290,400%2040,390'%20fill='%23b9c0c9'/%3E%3Cpolygon%20points='270,200%20530,190%20540,400%20290,400'%20fill='%23c62f25'/%3E%3Cpolygon%20points='40,390%20290,400%20300,415%2050,415'%20fill='%23b9c0c9'/%3E%3C/g%3E%3Cg%20font-family='Arial,sans-serif'%20font-size='17'%20fill='%231b1b1f'%20text-anchor='middle'%3E%3Ctext%20x='150'%20y='118'%3ELindholm%3C/text%3E%3Ctext%20x='405'%20y='112'%20fill='%23ffffff'%3EVerde%3C/text%3E%3Ctext%20x='160'%20y='305'%3EPierce%3C/text%3E%3Ctext%20x='410'%20y='300'%20fill='%23ffffff'%3ECalloway%3C/text%3E%3Ctext%20x='175'%20y='409'%20font-size='12'%3EAshby%3C/text%3E%3C/g%3E%3Crect%20x='360'%20y='20'%20width='14'%20height='14'%20fill='%23c62f25'/%3E%3Ctext%20x='380'%20y='32'%20font-family='Arial,sans-serif'%20font-size='12'%20fill='%231b1b1f'%3ESevere%20Heat%20Warning%3C/text%3E%3C/svg%3E">
      <p id="heatLongDesc" class="longdesc">
        Detailed description: Cascade County contains five counties — Lindholm, Verde, Pierce,
        Calloway, and Ashby. Counties currently under a Severe Heat Warning are shaded red on
        the map; counties with no active advisory are shaded grey. A Severe Heat Warning is
        issued when the forecast heat index reaches or exceeds 105&nbsp;degrees Fahrenheit. The
        present warning remains in effect until 8:00&nbsp;PM Thursday. Residents in warned areas
        should limit outdoor activity, hydrate, and check on vulnerable neighbours.
      </p>
      <p class="meta">Issued by the County Warning Coordination Office at 11:42 AM today. Map updates every 15 minutes.</p>
    </figure>
  </div>
</body>
</html>
