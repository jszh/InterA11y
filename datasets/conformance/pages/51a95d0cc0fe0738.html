<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverbank Playhouse — Choose Your Seats</title>
<style>
  :root { --ink:#1c1722; --plum:#5b2a86; --gold:#caa14a; --line:#e3dcec; --bg:#f6f2fb;
          --seat:#efe7f7; --seatline:#d9cce8; --sold:#cfc7d8; --stage:#2b2233; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--plum); color:#fff; padding:20px 28px; }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:.3rem 0 0; opacity:.92; font-size:.9rem; }
  main { max-width:640px; margin:0 auto; padding:30px 24px 80px; }
  h2 { color:var(--plum); font-size:1.2rem; }
  .chart { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 24px 26px; }
  .stage { background:var(--stage); color:var(--gold); text-align:center; letter-spacing:.35em;
           font-size:.75rem; font-weight:700; border-radius:8px; padding:8px 0; margin:0 0 22px; }

  .grid { display:grid; grid-template-columns:repeat(8,1fr);
          grid-template-rows:repeat(5,46px); gap:8px; }
  .grid button { font:inherit; font-size:.9rem; border:1px solid var(--seatline);
    background:var(--seat); border-radius:9px 9px 4px 4px; cursor:pointer; color:var(--ink); }
  .grid button:hover, .grid button:focus { background:var(--plum); color:#fff;
    outline:2px solid var(--gold); outline-offset:2px; }
  .grid button[aria-disabled="true"], .grid button[disabled] {
    color:#9b91a8; background:var(--sold); cursor:not-allowed; }

  .col-1{grid-column:1;} .col-2{grid-column:2;} .col-3{grid-column:3;} .col-4{grid-column:4;}
  .col-5{grid-column:5;} .col-6{grid-column:6;} .col-7{grid-column:7;} .col-8{grid-column:8;}
  .row-1{grid-row:1;} .row-2{grid-row:2;} .row-3{grid-row:3;} .row-4{grid-row:4;} .row-5{grid-row:5;}

  .legend { margin-top:16px; font-size:.82rem; color:#564b63; display:flex; gap:18px; }
  .legend span::before { content:""; display:inline-block; width:13px; height:13px;
    border-radius:3px; margin-right:6px; vertical-align:-2px; border:1px solid var(--seatline); }
  .legend .avail::before { background:var(--seat); }
  .legend .taken::before { background:var(--sold); }
  .note { margin-top:14px; font-size:.85rem; color:#564b63; }
</style>
</head>
<body>
<header>
  <h1>Riverbank Playhouse</h1>
  <p>An Evening of Chamber Music · Saturday 8:00 PM · choose your seats</p>
</header>
<main>
  <h2>Select seats (1–40)</h2>
  <p>Seats are numbered left to right, front to back. Tap an open seat to add it to your order.</p>

  <div class="chart" role="group" aria-label="Seating chart, seats 1 to 40">
    <p class="stage">STAGE</p>
    <div class="grid">
      <button class="col-1 row-1" aria-label="Seat 1, available">1</button>
      <button class="col-1 row-2" aria-label="Seat 9, available">9</button>
      <button class="col-1 row-3" aria-label="Seat 17, available">17</button>
      <button class="col-1 row-4" aria-label="Seat 25, sold" aria-disabled="true">25</button>
      <button class="col-1 row-5" aria-label="Seat 33, available">33</button>

      <button class="col-2 row-1" aria-label="Seat 2, available">2</button>
      <button class="col-2 row-2" aria-label="Seat 10, sold" aria-disabled="true">10</button>
      <button class="col-2 row-3" aria-label="Seat 18, available">18</button>
      <button class="col-2 row-4" aria-label="Seat 26, available">26</button>
      <button class="col-2 row-5" aria-label="Seat 34, available">34</button>

      <button class="col-3 row-1" aria-label="Seat 3, available">3</button>
      <button class="col-3 row-2" aria-label="Seat 11, available">11</button>
      <button class="col-3 row-3" aria-label="Seat 19, available">19</button>
      <button class="col-3 row-4" aria-label="Seat 27, available">27</button>
      <button class="col-3 row-5" aria-label="Seat 35, sold" aria-disabled="true">35</button>

      <button class="col-4 row-1" aria-label="Seat 4, available">4</button>
      <button class="col-4 row-2" aria-label="Seat 12, available">12</button>
      <button class="col-4 row-3" aria-label="Seat 20, available">20</button>
      <button class="col-4 row-4" aria-label="Seat 28, available">28</button>
      <button class="col-4 row-5" aria-label="Seat 36, available">36</button>

      <button class="col-5 row-1" aria-label="Seat 5, available">5</button>
      <button class="col-5 row-2" aria-label="Seat 13, available">13</button>
      <button class="col-5 row-3" aria-label="Seat 21, sold" aria-disabled="true">21</button>
      <button class="col-5 row-4" aria-label="Seat 29, available">29</button>
      <button class="col-5 row-5" aria-label="Seat 37, available">37</button>

      <button class="col-6 row-1" aria-label="Seat 6, available">6</button>
      <button class="col-6 row-2" aria-label="Seat 14, available">14</button>
      <button class="col-6 row-3" aria-label="Seat 22, available">22</button>
      <button class="col-6 row-4" aria-label="Seat 30, available">30</button>
      <button class="col-6 row-5" aria-label="Seat 38, available">38</button>

      <button class="col-7 row-1" aria-label="Seat 7, sold" aria-disabled="true">7</button>
      <button class="col-7 row-2" aria-label="Seat 15, available">15</button>
      <button class="col-7 row-3" aria-label="Seat 23, available">23</button>
      <button class="col-7 row-4" aria-label="Seat 31, available">31</button>
      <button class="col-7 row-5" aria-label="Seat 39, available">39</button>

      <button class="col-8 row-1" aria-label="Seat 8, available">8</button>
      <button class="col-8 row-2" aria-label="Seat 16, available">16</button>
      <button class="col-8 row-3" aria-label="Seat 24, available">24</button>
      <button class="col-8 row-4" aria-label="Seat 32, available">32</button>
      <button class="col-8 row-5" aria-label="Seat 40, available">40</button>
    </div>
    <div class="legend">
      <span class="avail">Available</span>
      <span class="taken">Sold</span>
    </div>
    <p class="note">Selected seats are held for 10 minutes while you complete checkout.</p>
  </div>
</main>
</body>
</html>
