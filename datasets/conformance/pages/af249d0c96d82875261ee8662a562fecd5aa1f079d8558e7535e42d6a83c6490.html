<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local weather</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#22324a;font:17px/1.55 system-ui,sans-serif}header{padding:22px 40px;background:#163954;color:white}main{max-width:880px;margin:36px auto;padding:32px;background:white;border-radius:12px;box-shadow:0 4px 18px #18395612}h1{font-size:28px;margin:0 0 12px}h2{font-size:20px}p{max-width:660px}a{color:#1556a0}button,select{font:inherit}button,.action{display:inline-block;padding:12px 22px;background:#164e73;color:white;border:2px solid #164e73;border-radius:6px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ac3900;outline-offset:4px}nav{display:flex;justify-content:space-between;margin-top:35px;padding-top:20px;border-top:1px solid #d4dce5}.panel{padding:20px;background:#f2f5f8;margin:20px 0}.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.item{padding:16px;border:1px solid #c7d5df;margin:12px 0}label{display:block;margin:15px 0}.pill{display:inline-block;padding:4px 14px;background:#e5f1ed;border-radius:20px}output{display:block;min-height:27px;margin-top:20px}summary{cursor:pointer;padding:12px 20px;background:#164e73;color:white;border-radius:6px}
 .forecast-controls{display:grid;grid-template-columns:130px 250px 130px;grid-template-rows:30px 58px 30px;width:max-content;max-width:100%;margin:22px 0}.forecast-controls button{border-radius:0;border:0;min-width:0}.forecast-controls #primary{grid-column:2;grid-row:2;position:relative;z-index:0}.forecast-controls #primary:focus,.forecast-controls #primary:focus-visible{outline:6px solid #ac3900;outline-offset:0}.forecast-controls .earlier{grid-column:1;grid-row:2;background:#e4ebf1;color:#22324a;position:relative;z-index:2}.forecast-controls .later{grid-column:3;grid-row:2;background:#e4ebf1;color:#22324a;position:relative;z-index:2}.forecast-controls .area{grid-column:1 / 4;grid-row:1;background:#e4ebf1;padding-left:15px;position:relative;z-index:2}.forecast-controls .updated{grid-column:1 / 4;grid-row:3;background:#e4ebf1;padding-left:15px;position:relative;z-index:2;font-size:14px} </style></head><body><header>Weather Desk</header><main><h1>Coastal forecast</h1><p>Tomorrow will be dry, with a light breeze in the afternoon.</p><p><a id="previous" href="#overview">Overview</a></p><section id="overview"><div class="forecast-controls"><button id="primary" onclick="document.getElementById('message').value='Coastal forecast saved.'">Save this location</button><button class="earlier" onclick="document.getElementById('message').value='Previous day selected.'">Previous day</button><button class="later" onclick="document.getElementById('message').value='Next day selected.'">Next day</button><div class="area">Coastal forecast</div><div class="updated">Updated at 08:00</div></div></section><output id="message" aria-live="polite"></output><nav><a id="next" href="#overview">Back to overview</a><a href="#message">Recent activity</a></nav></main></body></html>
