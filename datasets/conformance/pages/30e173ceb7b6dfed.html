<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حجز موعد — عيادة النخيل</title>
<style>
  :root { font-family: "Noto Naskh Arabic", "Segoe UI", system-ui, sans-serif; color: #1c2b2b; }
  body { margin: 0; background: #eef5f3; }
  header.clinic { background: #0d5c4f; color: #fff; padding: 14px 26px; display: flex; align-items: center; gap: 18px; }
  header.clinic .brand { font-weight: 700; }
  header.clinic nav a { color: #bfe3da; text-decoration: none; font-size: .9rem; margin-inline-start: 16px; }
  main { max-width: 700px; margin: 0 auto; padding: 26px; }
  .panel { background: #fff; border: 1px solid #cfe2dc; border-radius: 12px; padding: 20px; }
  .backdrop { position: fixed; inset: 0; background: rgba(13,92,79,.5); display: flex; align-items: center; justify-content: center; }
  .modal { background: #fff; width: min(460px, 92vw); border-radius: 14px; box-shadow: 0 22px 55px rgba(13,92,79,.4); overflow: hidden; }
  .mh { background: #0d5c4f; color: #fff; padding: 16px 22px; }
  .mh h2 { margin: 0; font-size: 1.1rem; }
  .mb { padding: 22px; }
  .mb label { display: block; font-weight: 600; font-size: .85rem; margin: 12px 0 6px; }
  .mb input, .mb select { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #9cc1b8; border-radius: 8px; font: inherit; }
  .mf { padding: 0 22px 22px; display: flex; gap: 10px; justify-content: flex-start; }
  .btn { border: none; border-radius: 8px; padding: 11px 20px; font-weight: 600; cursor: pointer; }
  .btn.go { background: #0d5c4f; color: #fff; }
  .btn.no { background: #e2efeb; color: #1c2b2b; }
</style>
</head>
<body>
<div id="page">
  <header class="clinic">
    <span class="brand">عيادة النخيل</span>
    <nav>
      <a href="#home">الرئيسية</a>
      <a href="#appointments">مواعيدي</a>
      <a href="#account">حسابي</a>
    </nav>
  </header>
  <main>
    <h1>حجز موعد</h1>
    <div class="panel">
      <p>الطبيبة: د. ليلى منصور — طب الأسرة</p>
      <p>الموعد المتاح: الأحد ٢٣ آب، ١٠:٣٠ صباحًا</p>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ap-title" id="modal">
    <div class="mh"><h2 id="ap-title">تأكيد الموعد</h2></div>
    <div class="mb">
      <label for="name">الاسم الكامل</label>
      <input id="name" type="text" value="منى الحربي">
      <label for="phone">رقم الجوال</label>
      <input id="phone" type="tel" value="٠٥٠١٢٣٤٥٦٧">
      <label for="reason">سبب الزيارة</label>
      <select id="reason"><option>فحص دوري</option><option>متابعة</option></select>
    </div>
    <div class="mf">
      <button type="button" class="btn go" id="confirm">تأكيد الحجز</button>
      <button type="button" class="btn no" id="cancel">إلغاء</button>
    </div>
  </div>
</div>

<script>
  const page = document.getElementById('page');
  const modal = document.getElementById('modal');

  page.inert = true;
  page.setAttribute('aria-hidden', 'true');

  function f() { return Array.from(modal.querySelectorAll('input, select, button')).filter(el => !el.disabled); }
  modal.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    const items = f(), first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }   
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } 
  });

  window.addEventListener('load', () => document.getElementById('name').focus());

  function close() { page.inert = false; page.removeAttribute('aria-hidden'); document.getElementById('backdrop').remove(); }
  document.getElementById('cancel').addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  document.getElementById('confirm').addEventListener('click', () => { document.getElementById('confirm').textContent = 'تم التأكيد ✓'; });
</script>
</body>
</html>
