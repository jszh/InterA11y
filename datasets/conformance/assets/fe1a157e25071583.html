<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick tour: pinning your first board</title>
  <style>
    body { font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1d2330; margin: 0; padding: 22px; background: #fbfcff; }
    h2 { font-size: 1.05rem; margin: 0 0 8px; }
    p { color: #5b6473; margin: 0 0 16px; }
    .dots { display: flex; gap: 7px; margin: 0 0 18px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: #cdd5e4; display: inline-block; }
    .dots i.on { background: #2f5fe0; }
    button { font: inherit; font-weight: 700; color: #fff; background: #2f5fe0; border: 0; border-radius: 9px; padding: 10px 18px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #08245e; outline-offset: 3px; }
  </style>
</head>
<body>
  <h2>Pin your first board</h2>
  <p>Boards keep related tasks together. Pin the ones you open most so they stay at the top of your sidebar.</p>
  <div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
  <button id="gotit" type="button">Got it</button>
  <script>
    var b = document.getElementById('gotit');
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); b.focus(); }
    }, true);
    b.addEventListener('blur', function () { b.focus(); });
  </script>
</body>
</html>
