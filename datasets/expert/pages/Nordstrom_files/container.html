:root {
  /* Colors */
  --banner-color-foreground-default: #191A1B;
  --banner-color-foreground-subtle: #647175;
  --banner-color-background-subtle: #F0F3F5;
  --banner-color-background-default: #FFFFFF;
  --banner-color-gray-80: #3E4142;
  --banner-color-gray-90: #2B2E2F;
  --banner-color-gray-20: #DCE3E6;
  --banner-color-pink-20: #F9D8F2;

  /* Typography */
  --banner-font-family: "Brandon Text", Arial, sans-serif;
  --banner-font-weight-bold: 700;
  --banner-font-weight-normal: 400;

  /* Border Radius */
  --banner-border-radius-small: 2px;
  --banner-border-radius-medium: 4px;
  --banner-border-radius-large: 8px;

  /* Spacing */
  --banner-space-2xs: 2px;
  --banner-space-xs: 4px;
  --banner-space-sm: 8px;
  --banner-space-md: 12px;

  /* Horizontal margins */
  --banner-margin-horizontal: 16px;
  --banner-margin-horizontal-large: 32px;

  /* Vertical spacing: 24px top (full), 12px bottom (accounting for footer space) */
  --banner-margin-vertical-top: 24px;
  --banner-margin-vertical-bottom: 12px;

  /* Elevation */
  --banner-shadow-subtle: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
  --banner-shadow-elevated: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

/* Font Face */
@font-face {
  font-family: "Brandon Text";
  src: url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.eot");
  src: local("BrandonText-Bold"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.eot?#iefix") format("embedded-opentype"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.woff2") format("woff2"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.woff") format("woff"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.ttf") format("truetype"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.svg#BrandonText-Bold") format("svg");
  font-weight: 700;
  font-style: normal;
}

@font-face {
  font-family: "Brandon Text";
  src: url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.eot");
  src: local("BrandonText-Regular"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.eot?#iefix") format("embedded-opentype"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.woff2") format("woff2"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.woff") format("woff"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.ttf") format("truetype"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.svg#BrandonText-Regular") format("svg");
  font-weight: 400;
  font-style: normal;
}

/* ============================================
   WRAPPER
   ============================================ */

.banner__wrapper {
  max-width: 1600px;
  container-type: inline-size;
}

a:link {
  text-decoration: none;
}

/* ============================================
   BANNER CONTAINER
   ============================================ */

.banner {
  position: relative;
  width: 100%;
  overflow: hidden;
  font-family: var(--banner-font-family);
  border-radius: var(--banner-border-radius-large);
  display: flex;
  flex-direction: column;
  box-shadow: var(--banner-shadow-subtle);
  transition: box-shadow 0.2s ease;
  cursor: pointer;
  box-sizing: border-box;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  container-name: banner;
  container-type: inline-size;
  height: 13.67cqw;
  min-height: 130px;
}

.banner:hover {
  box-shadow: var(--banner-shadow-elevated);
}

/* ============================================
   CONTENT LAYOUT
   ============================================ */

.banner__content {
  position: relative;
  z-index: 1;
  display: flex;
  padding: 0.5rem;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
  width: 100%;
  height: 100%;
  max-width: 1600px;
  margin: 0 auto;
  box-sizing: border-box;
}

/* Text Content Block */
.banner__text {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  height: 100%;
}

.banner__text-inner {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.banner__text-group {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

/* ============================================
   TEXT ELEMENTS
   ============================================ */

.banner__badge {
  display: flex;
  padding: var(--banner-space-2xs) var(--banner-space-xs);
  justify-content: center;
  align-items: center;
  align-self: flex-start;
  border-radius: var(--banner-border-radius-small);
  background: var(--banner-color-pink-20);
  color: var(--banner-color-foreground-default);
  font-feature-settings: 'liga' off, 'clig' off;
  font-family: var(--banner-font-family);
  font-size: 0.75rem;
  font-style: normal;
  font-weight: var(--banner-font-weight-bold);
  line-height: 1.333;
  letter-spacing: 0;
  white-space: nowrap;
  position: relative;
  z-index: 2;
}

.banner__headline {
  font-family: var(--banner-font-family);
  font-size: 1rem;
  font-weight: var(--banner-font-weight-bold);
  margin: 0;
  line-height: 1.5;
}

.banner__body {
  font-family: var(--banner-font-family);
  font-size: 0.75rem;
  font-weight: var(--banner-font-weight-normal);
  margin: 0;
  line-height: 1.333;
  display: none;
}

/* Text color based on button variant */
.banner[data-text-variant="dark"] .banner__headline,
.banner[data-text-variant="dark"] .banner__body {
  color: #000000;
}

.banner[data-text-variant="light"] .banner__headline,
.banner[data-text-variant="light"] .banner__body {
  color: #FFFFFF;
}

.banner__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--banner-font-family);
  font-size: 0.75rem;
  font-weight: var(--banner-font-weight-bold);
  background: var(--banner-color-background-subtle);
  color: var(--banner-color-foreground-default);
  border: none;
  border-radius: var(--banner-border-radius-medium);
  padding: 6px 12px;
  min-height: 32px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  text-decoration: none;
  align-self: flex-start;
}

/* Button Variants */
.banner__button[data-variant="dark"] {
  background: var(--banner-color-foreground-default);
  color: var(--banner-color-background-default);
}

.banner__button[data-variant="dark"]:hover,
.banner:hover .banner__button[data-variant="dark"] {
  background: var(--banner-color-gray-80) !important;
}

.banner__button[data-variant="dark"]:active {
  background: var(--banner-color-gray-90) !important;
}

.banner__button[data-variant="light"] {
  background: var(--banner-color-background-default);
  color: var(--banner-color-foreground-default);
}

.banner__button[data-variant="light"]:hover,
.banner:hover .banner__button[data-variant="light"] {
  background: var(--banner-color-background-subtle) !important;
}

.banner__button[data-variant="light"]:active {
  background: var(--banner-color-gray-20) !important;
}

.banner__button:focus {
  outline: none;
}

.banner__button:focus-visible {
  outline: 2px solid var(--banner-color-foreground-default);
  outline-offset: 2px;
}

/* ============================================
   IMAGE CONTAINER
   ============================================ */

.banner__images {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 0.5rem;
  flex: 1 0 0;
  align-self: stretch;
}

/* Atomic Image Component */
.banner__image {
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  height: 100%;
}

.banner__image--inset {
  border-radius: var(--banner-border-radius-medium);
  border: 1px solid rgba(25, 26, 27, 0.10);
}

.banner__image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: smooth;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  transform: translateZ(0);
}

/* ============================================
   FOOTER
   ============================================ */

.banner__footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: var(--banner-space-xs);
  font-family: var(--banner-font-family);
  font-size: 0.75rem;
  font-weight: var(--banner-font-weight-normal);
  line-height: 1.333;
  width: 100%;
}

.banner__link {
  text-decoration: underline !important;
  color: var(--banner-color-foreground-default);
  text-underline-offset: 2px;
}

.banner__link:hover {
  text-decoration-thickness: 1px !important;
}

.banner__label {
  color: var(--banner-color-foreground-subtle);
  margin-left: auto;
}

/* ============================================
   TIER MODIFIERS - BASE (Mobile First)
   ============================================ */

/* All images default to 5:4 on small screens */
.banner__image {
  aspect-ratio: 5 / 4;
}

/* Tier 1: Single large image, 4:1 aspect ratio */
.banner.banner--tier1 .banner__image {
  aspect-ratio: 4 / 1;
}

/* Tier 2: Two images, 8:5 aspect ratio */
.banner.banner--tier2 .banner__image {
  aspect-ratio: 8 / 5;
}

/* Tier 3: Three images, 5:4 aspect ratio */
.banner.banner--tier3 .banner__image {
  aspect-ratio: 5 / 4;
}

/* ============================================
   CONTAINER QUERIES
   ============================================ */

/* Reduce min-height below 428px */
@container (max-width: 428px) {
  .banner {
    min-height: 96px;
  }

  .banner__headline {
    font-size: 0.875rem;
    line-height: 1.5;
  }

  .banner__text-inner {
    gap: 0.25rem;
  }

  .banner__text-group:has(.banner__badge) {
    gap: 0;
  }

  .banner.banner--has-enticement .banner__text-inner .banner__button {
    display: none; /* Hide button at small screens when enticement is enabled */
  }

  /* Tier 2 & 3: Tighter gaps at smallest breakpoint */
  .banner.banner--tier2 .banner__content,
  .banner.banner--tier3 .banner__content {
    gap: 0.25rem;
  }

  .banner.banner--tier2 .banner__images,
  .banner.banner--tier3 .banner__images {
    gap: 0.25rem;
  }
}

/* Below 600px adjustments */
@container (max-width: 600px) {
  /* Tier 1: 2.25:1 aspect ratio */
  .banner.banner--tier1 .banner__image {
    aspect-ratio: 2.25 / 1;
  }

  /* Tier 2: All images become 5:4 */
  .banner.banner--tier2 .banner__image {
    aspect-ratio: 5 / 4;
  }

  /* Tier 3: Hide 3rd image at 600px and below */
  .banner.banner--tier3 .banner__image:nth-child(3) {
    display: none !important;
  }

  /* All tiers: Remove padding from text container below 600px */
  .banner .banner__text {
    padding: 0;
  }

  /* With enticement: smaller headline for more text space */
  .banner.banner--has-enticement .banner__headline {
    font-size: 0.75rem;
    line-height: 1.333;
  }
}

/* 768px and above */
@container (min-width: 768px) {
  /* Tier 2: Both images 8:5 */
  .banner.banner--tier2 .banner__image {
    aspect-ratio: 8 / 5;
  }

  /* Tier 3: All images 8:5 */
  .banner.banner--tier3 .banner__image {
    aspect-ratio: 8 / 5;
  }
}

/* 873px and above */
@container (min-width: 873px) {
  /* Show body text */
  .banner__body {
    display: block;
  }
}

/* 900px and above */
@container (min-width: 900px) {
  /* Text spacing */
  .banner__text-inner {
    gap: 0.75rem;
  }

  /* Tier 2: Both images switch to 3:1 at 900px+ */
  .banner.banner--tier2 .banner__image {
    aspect-ratio: 3 / 1;
  }
}

/* 1200px and above */
@container (min-width: 1200px) {
  /* Add padding to text at desktop sizes */
  .banner__text {
    padding: 0.5rem;
  }

  /* Tier 3: 2:1 aspect ratio */
  .banner.banner--tier3 .banner__image {
    aspect-ratio: 2 / 1;
  }

  /* Desktop typography */
  .banner__headline {
    font-size: 1.25rem;
    line-height: 1.4;
  }

  .banner__body {
    font-size: 0.875rem;
    line-height: 1.5;
  }
}

/* With enticement badge: adjust aspect ratios for more text space */
@container (max-width: 899px) {
  .banner.banner--tier3.banner--has-enticement .banner__image {
    aspect-ratio: 5 / 4;
  }
}

@container (min-width: 1200px) and (max-width: 1439px) {
  .banner.banner--tier3.banner--has-enticement .banner__image {
    aspect-ratio: 8 / 5;
  }
}

@container (min-width: 1440px) {
  /* Large desktop typography */
  .banner__headline {
    font-size: 1.5rem;
    line-height: 1.333;
  }

  .banner__body {
    font-size: 1rem;
    line-height: 1.5;
  }

  /* Tier 3 with enticement: 2:1 aspect ratio */
  .banner.banner--tier3.banner--has-enticement .banner__image {
    aspect-ratio: 2 / 1;
  }
}

/* ============================================
   MOBILE MEDIA QUERIES
   ============================================ */

@media only screen and (max-width: 428px) {
  .banner {
    min-height: 96px;
  }
  
  .banner__text {
    max-width: calc(50% - 0.5rem);
  }

  .banner.banner--tier2 .banner__content,
  .banner.banner--tier3 .banner__content {
    padding: var(--banner-space-xs);
  }

  .banner.banner--tier2 .banner__images,
  .banner.banner--tier3 .banner__images {
    gap: var(--banner-space-xs);
  }
}

<script type="text/javascript">
// Helper function to check if a value is valid (not empty, not a macro, not "undefined")
function isValidValue(value) {
  return value &&
         value !== '' &&
         value !== 'undefined' &&
         !(value.startsWith('[%') && value.endsWith('%]'));
}

// Helper function to check if a flag value is "Yes" or "True"
function isEnabled(value) {
  return value && (value.toLowerCase() === 'yes' || value.toLowerCase() === 'true');
}

document.addEventListener('DOMContentLoaded', function() {
  const container = document.getElementById('bannerContainer');
  const imageContainer = document.getElementById('imageContainer');
  const images = imageContainer.querySelectorAll('.banner__image');
  const enticementBadge = document.getElementById('enticementBadge');
  const disclaimerLink = document.getElementById('disclaimerLink');
  const sponsoredLabel = document.getElementById('sponsoredLabel');
  const bodyElement = document.getElementById('bannerBody');
  const headlineElement = document.getElementById('bannerHeadline');

  // Track container width for responsive image switching
  let containerWidth = 0;

  // === Color Presets ===
  const COLOR_PRESETS = {
    'Light Grey (#F3F0EF)': '#F3F0EF',
    'Medium Grey (#D7D2CB)': '#D7D2CB',
    'Black (#000000)': '#000000',
    'Holiday Red (#B80009)': '#B80009',
    'Holiday Blue (#002456)': '#002456',
    'Holiday Green (#024124)': '#024124',
    'Anniversary Yellow (#FBE446)': '#FBE446'
  };

  // === Handle Background (Color or Image) with Gradient Overlay ===
  const bgColorRaw = container.getAttribute('data-bg-color');
  const bgColor = COLOR_PRESETS[bgColorRaw] || bgColorRaw;
  const bgImage = container.getAttribute('data-bg-image');
  const bgUseGradient = container.getAttribute('data-bg-use-gradient');
  const bgGradientStyle = container.getAttribute('data-bg-gradient-style');

  // Define gradient styles
  const gradients = {
    light: 'linear-gradient(90deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.40) 75%)',
    dark: 'linear-gradient(90deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.18) 75%)'
  };

  const gradient = gradients[bgGradientStyle];

  // Apply background with gradient overlay if needed
  if (isValidValue(bgImage)) {
    container.style.background = `${gradient}, url('${bgImage}') center/cover no-repeat`;

    // Monitor for image load failure
    // If image fails to load, apply gradient fallback
    const bgImageElement = new Image();
    bgImageElement.onerror = function() {
      if (isValidValue(bgColor)) {
        container.style.background = `${gradient}, ${bgColor}`;
      } else {
        container.style.background = gradient;
      }
    };
    bgImageElement.src = bgImage;
  } else if (isValidValue(bgColor)) {
    if (isEnabled(bgUseGradient)) {
      container.style.background = `${gradient}, ${bgColor}`;
    } else {
      container.style.backgroundColor = bgColor;
    }
  } else {
    container.style.background = gradient;
  }

  // === Auto-Detect Text & Button Colors Based on Background ===
  const ctaButton = document.getElementById('ctaButton');

  // Helper function to convert hex to RGB (matches Banner.tsx)
  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  // Helper function to calculate luminance (WCAG formula, matches Banner.tsx)
  function getLuminance(rgb) {
    const [r, g, b] = [rgb.r, rgb.g, rgb.b].map(val => {
      val = val / 255;
      return val <= 0.03928 ? val / 12.92 : Math.pow((val + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  // Helper function to determine if background is light (matches Banner.tsx)
  function isLightBackground(bgColor) {
    const rgb = hexToRgb(bgColor);
    if (!rgb) return false;
    const bgLuminance = getLuminance(rgb);
    const contrastWithBlack = (bgLuminance + 0.05) / 0.05;
    const contrastWithWhite = 1.05 / (bgLuminance + 0.05);
    // Returns true if background has better contrast with black text than white text
    // (i.e., it's a light background)
    return contrastWithBlack > contrastWithWhite;
  }

  // Determine variant based on background configuration
  // Priority order: explicit gradient style > color luminance > default dark gradient (light text)
  let componentVariant = 'light'; // Default: light variant (white text/button) for dark gradient

  if (isEnabled(bgUseGradient)) {
    // useGradient enabled: respect the gradient style
    componentVariant = bgGradientStyle === 'light' ? 'dark' : 'light';
  } else if (!isValidValue(bgImage) && isValidValue(bgColor) && isLightBackground(bgColor)) {
    // No gradient, no image: use color luminance
    componentVariant = 'dark';
  }

  // Apply variant to button and text
  ctaButton.setAttribute('data-variant', componentVariant);
  container.setAttribute('data-text-variant', componentVariant);

  // === Handle Sponsored Label Visibility ===
  const isSponsored = sponsoredLabel.getAttribute('data-is-sponsored');
  if (!isEnabled(isSponsored)) {
    sponsoredLabel.style.display = 'none';
  }

  // === Handle Enticement Badge & Disclaimer Visibility ===
  const displayEnticement = enticementBadge.getAttribute('data-display-enticement');
  const displayDisclaimer = disclaimerLink.getAttribute('data-display-disclaimer');

  if (!isEnabled(displayEnticement)) {
    enticementBadge.style.display = 'none';
    disclaimerLink.style.display = 'none';
  } else {
    container.classList.add('banner--has-enticement');
    if (!isEnabled(displayDisclaimer)) {
      disclaimerLink.style.display = 'none';
    }
  }

  // === Detect Image Count & Set Tier ===
  let visibleImageCount = 0;
  const imageElements = [];

  images.forEach((imageDiv) => {
    const imgDT = imageDiv.getAttribute('data-img-dt');
    const imgMOW = imageDiv.getAttribute('data-img-mow');
    const hasImage = isValidValue(imgDT) || isValidValue(imgMOW);

    if (hasImage) {
      visibleImageCount++;
      imageDiv.style.display = 'block';
      imageElements.push({
        div: imageDiv,
        img: imageDiv.querySelector('img'),
        dt: imgDT,
        mow: imgMOW
      });
    } else {
      imageDiv.style.display = 'none';
    }
  });

  // Apply tier class (min tier1 as fallback)
  const tier = `tier${Math.max(visibleImageCount, 1)}`;
  container.classList.add(`banner--${tier}`);

  // === Image Source Selection Based on Container Width ===
  function getImageSrc(imageElement, width) {
    const { dt, mow } = imageElement;

    // Tier 1: DT at 600px+, MOW below 600px
    if (tier === 'tier1') {
      if (width < 600) {
        return isValidValue(mow) ? mow : dt;
      }
      return isValidValue(dt) ? dt : mow;
    }

    // Tier 2: DT at 900px+, MOW below 900px
    if (tier === 'tier2') {
      if (width < 900) {
        return isValidValue(mow) ? mow : dt;
      }
      return isValidValue(dt) ? dt : mow;
    }

    // Tier 3: depends on enticement badge
    if (tier === 'tier3') {
      const hasEnticement = isEnabled(displayEnticement);

      if (hasEnticement) {
        // With enticement: MOW below 900px, DT at 900px+
        if (width < 900) {
          return isValidValue(mow) ? mow : dt;
        }
        return isValidValue(dt) ? dt : mow;
      } else {
        // No enticement: MOW below 768px, DT at 768px+
        if (width < 768) {
          return isValidValue(mow) ? mow : dt;
        }
        return isValidValue(dt) ? dt : mow;
      }
    }

    return isValidValue(dt) ? dt : mow;
  }

  // === Update Images Based on Container Width ===
  function updateImages(width) {
    imageElements.forEach(imageElement => {
      const newSrc = getImageSrc(imageElement, width);
      if (isValidValue(newSrc) && imageElement.img.src !== newSrc) {
        imageElement.img.src = newSrc;
      }
    });
  }

  // === Hide Body Text Based on Conditions ===
  function updateBodyVisibility(width) {
    // Hide body if: tier 2/3 + enticement exists + combined text > 70 chars + width < 1440px
    const hasEnticement = isEnabled(displayEnticement);
    const headlineText = headlineElement ? (headlineElement.textContent || headlineElement.innerText || '') : '';
    const bodyText = bodyElement ? (bodyElement.textContent || bodyElement.innerText || '') : '';
    const combinedTextLength = headlineText.length + bodyText.length;

    const shouldHideBody = (tier === 'tier2' || tier === 'tier3')
      && hasEnticement
      && combinedTextLength > 70
      && width < 1440;

    if (bodyElement) {
      bodyElement.style.display = shouldHideBody ? 'none' : '';
    }
  }

  // === ResizeObserver for Container Width Tracking ===
  const resizeObserver = new ResizeObserver((entries) => {
    for (const entry of entries) {
      containerWidth = entry.contentRect.width;
      updateImages(containerWidth);
      updateBodyVisibility(containerWidth);
    }
  });

  resizeObserver.observe(container);

  // Initial image load and body visibility
  containerWidth = container.offsetWidth;
  updateImages(containerWidth);
  updateBodyVisibility(containerWidth);

  // === Terms Apply Modal Handler ===
  disclaimerLink.addEventListener('click', (e) => {
    e.preventDefault(); // Prevent default link navigation (href="#")
    e.stopPropagation(); // Prevent click from bubbling to parent banner link (gamBannerSlot)

    if (!isEnabled(displayEnticement) || !isEnabled(displayDisclaimer)) {
      return;
    }

    const disclaimerContent = disclaimerLink.getAttribute('data-content');
    const enticementText = enticementBadge.textContent || enticementBadge.innerText;

    const disclaimerData = {
      type: "display_gam_banner_disclaimer_modal",
      title: isValidValue(enticementText) ? enticementText : 'Terms & Conditions',
      content: disclaimerContent
    };
    window.parent.postMessage(disclaimerData, '*');
  });
});
</script>
