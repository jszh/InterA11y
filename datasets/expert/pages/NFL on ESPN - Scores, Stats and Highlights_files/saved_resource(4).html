
<!-- saved from url=(0011)about:blank -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><script type="application/javascript">
try {
  var adUnitContainer = window.frameElement.parentElement.parentElement;
  adUnitContainer.refreshCount = (adUnitContainer.refreshCount || 0) + 1;
  
  if(adUnitContainer.refreshCount <= 3) {
    var bidResponse = window.top.pbjs.getHighestUnusedBidResponseForAdUnitCode(adUnitContainer.id);
    if(bidResponse && bidResponse.adId) {
      console.log('Ad replacement prebid', bidResponse)
      window.top.pbjs.renderAd(window.document, bidResponse.adId);
    } else {
      var slot = window.top.googletag.pubads().getSlots().find(slot => window.frameElement.id.includes(slot.getSlotId().getId()));
      console.log('Ad replacement gpt', slot)
      if(slot) {
        window.top.googletag.pubads().refresh([slot]);
      }
    }
  } else {
    console.log('Ad replacement limit reached', adUnitContainer.refreshCount);
  }
} catch(e) {
  console.log('Ad replacement error', e);
}
</script></head><body marginwidth="0" marginheight="0"></body></html>
